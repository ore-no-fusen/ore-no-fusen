name = "ore-no-fusen-discord-replies"
main = "src/index.js"
compatibility_date = "2026-06-16"
workers_dev = false

[vars]
INGEST_ENVIRONMENT = "production"
DISCORD_GATEWAY_ENABLED = "false"
GATEWAY_DELIVERY_ENVIRONMENTS = "development"

[triggers]
crons = ["* * * * *"]

[[durable_objects.bindings]]
name = "INGEST_COORDINATOR"
class_name = "DiscordIngestCoordinator"
[[durable_objects.bindings]]
name = "DISCORD_GATEWAY"
class_name = "DiscordGateway"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DiscordIngestCoordinator"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["DiscordGateway"]

[observability]
enabled = true

[env.development]
name = "ore-no-fusen-discord-replies-development"
workers_dev = false

[env.development.vars]
INGEST_ENVIRONMENT = "development"

[env.development.triggers]
crons = ["* * * * *"]

[[env.development.durable_objects.bindings]]
name = "INGEST_COORDINATOR"
class_name = "DiscordIngestCoordinator"

# Development runs REST import only. Do not inherit the production Gateway registration.
[[env.development.migrations]]
tag = "v1"
new_sqlite_classes = ["DiscordIngestCoordinator"]
