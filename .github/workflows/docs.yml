name: Deploy Docs to GitHub Pages

on:
  workflow_call:
    inputs:
      deploy:
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: design-docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs-v2/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: docs-v2

      - name: Build
        run: npm run docs:build
        working-directory: docs-v2

      - name: Upload artifact
        if: github.ref == 'refs/heads/main' && (inputs.deploy || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs-v2/.vitepress/dist

  deploy:
    if: github.ref == 'refs/heads/main' && (inputs.deploy || github.event_name == 'workflow_dispatch')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
