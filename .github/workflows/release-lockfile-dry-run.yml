name: Release Lockfile Dry Run

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Code to verify (normally develop)'
        required: true
        default: develop
        type: string
      version:
        description: 'Release version to verify (for example 5.0.1)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-release-lockfile:
    runs-on: ubuntu-latest
    env:
      SOURCE_REF: ${{ inputs.source_ref }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout requested code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate requested version
        shell: bash
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use MAJOR.MINOR.PATCH form, for example 5.0.1."
            exit 1
          fi

          current="$(node -p "require('./package.json').version")"
          if [[ "$(printf '%s\n%s\n' "$RELEASE_VERSION" "$current" | sort -V | head -1)" == "$RELEASE_VERSION" ]]; then
            echo "Release version ($RELEASE_VERSION) must be greater than current version ($current)."
            exit 1
          fi

          echo "Verifying $SOURCE_REF as a temporary v$RELEASE_VERSION release."

      - name: Apply version only inside this runner
        shell: bash
        run: |
          cp src-tauri/Cargo.lock "$RUNNER_TEMP/Cargo.lock.before"
          sed -i "0,/^version = /s/^version = \"[^\"]*\"/version = \"$RELEASE_VERSION\"/" src-tauri/Cargo.toml
          node -e '
            const fs = require("fs");
            const path = "src-tauri/Cargo.lock";
            const lock = fs.readFileSync(path, "utf8");
            const pattern = /(\[\[package\]\]\r?\nname = "ore-no-fusen"\r?\nversion = ")[^"]+/;
            if (!pattern.test(lock)) throw new Error("ore-no-fusen package was not found in Cargo.lock.");
            fs.writeFileSync(path, lock.replace(pattern, `$1${process.env.RELEASE_VERSION}`));
          '

      - name: Verify Cargo.lock only changed its root package version
        shell: bash
        run: node scripts/verify-cargo-lock-release.mjs "$RUNNER_TEMP/Cargo.lock.before" src-tauri/Cargo.lock

      - name: Check the temporary locked dependency graph
        shell: bash
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Confirm dry-run scope
        shell: bash
        run: |
          echo "Dry run passed for v$RELEASE_VERSION from $SOURCE_REF."
          echo "No commit, push, tag, GitHub Release, winget update, MSIX upload, or Microsoft Store submission was performed."
