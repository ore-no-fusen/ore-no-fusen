name: Test

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  rust:
    runs-on: windows-latest
    # gdrive.rs は env!() で GDRIVE_* をコンパイル時に埋め込む。
    # ローカルは ../.env.local（build.rs 経由）で供給されるが CI には無いため、
    # ユニットテスト用のダミー値を渡してコンパイルを通す（Drive へ実アクセスしない）。
    env:
      GDRIVE_CLIENT_ID: ci-dummy
      GDRIVE_CLIENT_SECRET: ci-dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build:tauri
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --lib
      - name: cargo test (symlink safety, ignored)
        working-directory: src-tauri
        run: cargo test --lib -- --ignored
