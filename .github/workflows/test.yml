name: Test

on:
  push:
    branches: [develop, main]
  pull_request:
  merge_group:

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GDRIVE_CLIENT_ID: ci-dummy
  GDRIVE_CLIENT_SECRET: ci-dummy

jobs:
  scope:
    timeout-minutes: 3
    runs-on: ubuntu-latest
    outputs:
      msix: ${{ steps.scope.outputs.msix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check routing and failure policy
        run: node --test scripts/ci-scope.test.mjs
      - name: Determine required checks
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: node scripts/ci-scope.mjs "$BASE" "$HEAD"

  usage-analysis:
    name: Dashboard analysis regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test scripts/member-usage-analysis.test.mjs

  frontend:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        timeout-minutes: 5
      - run: npx playwright install chromium
        timeout-minutes: 3
      - name: Release machine isolated Git tests
        run: node --test --test-reporter=tap scripts/release-machine/engine.test.mjs
      - name: Release machine browser tests
        run: node --test --test-reporter=tap scripts/release-machine/ui.test.mjs
      - name: Public guide build and publication boundary
        run: |
          node --test scripts/export-public-guide.test.mjs
          npm --prefix public-guide ci
          npm --prefix public-guide run build
      - name: Public guide settings navigation (Japanese and English)
        run: npm run test:e2e -- e2e/public-guide-links.spec.ts
      - run: node --test scripts/release-machine/runner.test.mjs scripts/tauri-frontend-stage.test.mjs scripts/msix-status.test.mjs scripts/automation-policy.test.mjs scripts/ci-artifact-policy.test.mjs scripts/network-deadline.test.mjs
        timeout-minutes: 5
      - run: node --test workers/discord-replies/src/index.test.mjs
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build:tauri

  rust:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/debug/
          key: ${{ runner.os }}-test-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-test-cargo-
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked

  msix:
    needs: [scope, frontend, rust, usage-analysis]
    if: needs.scope.outputs.msix == 'true'
    permissions:
      contents: read
    with:
      prevalidated: true
    uses: ./.github/workflows/msix-ci.yml

  gate:
    timeout-minutes: 3
    name: CI gate
    if: always()
    needs: [scope, usage-analysis, frontend, rust, msix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require every applicable check
        env:
          SCOPE: ${{ needs.scope.outputs.msix }}
          SCOPE_RESULT: ${{ needs.scope.result }}
          USAGE_RESULT: ${{ needs.usage-analysis.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          MSIX_RESULT: ${{ needs.msix.result }}
        run: node scripts/ci-scope.mjs gate

