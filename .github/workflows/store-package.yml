name: Build Store Package

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Committed Store release to build (normally main)'
        required: true
        default: main
        type: string
      version:
        description: 'Committed Store version (for example 5.1.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: build-store-package
  cancel-in-progress: false

jobs:
  build-store-package:
    runs-on: windows-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
      SOURCE_REF: ${{ inputs.source_ref }}
      STORE_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout committed Store release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-store-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-store-cargo-

      - name: Verify committed version
        shell: pwsh
        run: |
          if ($env:STORE_VERSION -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Version must use MAJOR.MINOR.PATCH form, for example 5.1.0."
          }

          $packageVersion = (Get-Content package.json -Raw -Encoding utf8 | ConvertFrom-Json).version
          $cargoVersion = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          [xml]$manifest = Get-Content packaging/msix/AppxManifest.xml -Raw -Encoding utf8
          $manifestVersion = $manifest.Package.Identity.Version
          $cargoLock = Get-Content src-tauri/Cargo.lock -Raw -Encoding utf8
          $cargoPattern = '(?s)\[\[package\]\]\r?\nname = "ore-no-fusen"\r?\nversion = "([^"]+)"'
          if ($cargoLock -notmatch $cargoPattern) { throw "ore-no-fusen package was not found in Cargo.lock." }
          $cargoLockVersion = $Matches[1]

          if ($packageVersion -ne $env:STORE_VERSION -or $cargoVersion -ne $env:STORE_VERSION -or $cargoLockVersion -ne $env:STORE_VERSION) {
            throw "Committed application versions must all equal $env:STORE_VERSION."
          }
          if ($manifestVersion -ne "$env:STORE_VERSION.0") {
            throw "MSIX manifest version must be $env:STORE_VERSION.0, got $manifestVersion."
          }

          Write-Host "Building committed Store release $env:STORE_VERSION from $env:SOURCE_REF ($env:GITHUB_SHA)."

      - run: npm ci

      - name: Build executable only (no NSIS or MSI)
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
        run: npm run tauri build -- --no-bundle --ci

      - name: Prepare resources normally created by the bundler
        shell: pwsh
        run: |
          $resourcesPath = 'src-tauri/target/release/resources'
          New-Item -ItemType Directory -Path $resourcesPath -Force | Out-Null
          Copy-Item -LiteralPath 'src-tauri/icons/icon.ico' -Destination "$resourcesPath/icon.ico" -Force

      - name: Build unsigned Store MSIX
        run: powershell -ExecutionPolicy Bypass -File packaging\msix\build-msix.ps1

      - name: Validate Store MSIX
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File packaging\msix\validate-msix.ps1 `
            -PackagePath packaging\msix\out\ore-no-fusen.msix `
            -ExpectedVersion "$env:STORE_VERSION.0"

      - name: Upload private Store submission artifact
        uses: actions/upload-artifact@v4
        with:
          name: store-msix
          path: packaging/msix/out/ore-no-fusen.msix
          if-no-files-found: error
          retention-days: 30

      - name: Confirm manual Store submission scope
        shell: pwsh
        run: |
          Write-Host "Store package v$env:STORE_VERSION was created from committed source."
          Write-Host "Download this artifact and submit it manually in Microsoft Partner Center."
          Write-Host "No tag, GitHub Release, NSIS/MSI bundle, updater metadata, repository commit, or Microsoft Store submission was created."
