name: Build Store Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Store package version (for example 5.0.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: build-store-package
  cancel-in-progress: false

jobs:
  build-store-package:
    runs-on: windows-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
      STORE_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout develop without publishing
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-store-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-store-cargo-

      - name: Validate requested version
        shell: pwsh
        run: |
          if ($env:STORE_VERSION -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Version must use MAJOR.MINOR.PATCH form, for example 5.0.0."
          }

          $current = (Get-Content package.json -Raw -Encoding utf8 | ConvertFrom-Json).version
          if ([version]$env:STORE_VERSION -le [version]$current) {
            throw "Store package version must be greater than current version $current."
          }

          Write-Host "Preparing private Store package $env:STORE_VERSION from develop ($env:GITHUB_SHA)."

      - run: npm ci

      - name: Apply Store version only inside this runner
        shell: pwsh
        run: |
          npm version $env:STORE_VERSION --no-git-tag-version --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw "npm version failed." }

          $cargoTomlPath = 'src-tauri/Cargo.toml'
          $cargoToml = Get-Content $cargoTomlPath -Raw -Encoding utf8
          $cargoToml = $cargoToml -replace '(?m)^version = "[^"]+"', "version = `"$env:STORE_VERSION`""
          Set-Content $cargoTomlPath $cargoToml -NoNewline -Encoding utf8

          $cargoLockPath = 'src-tauri/Cargo.lock'
          $cargoLock = Get-Content $cargoLockPath -Raw -Encoding utf8
          $cargoPattern = '(?s)(\[\[package\]\]\r?\nname = "ore-no-fusen"\r?\nversion = ")[^"]+'
          if ($cargoLock -notmatch $cargoPattern) { throw "ore-no-fusen package was not found in Cargo.lock." }
          $cargoLock = $cargoLock -replace $cargoPattern, "`${1}$env:STORE_VERSION"
          Set-Content $cargoLockPath $cargoLock -NoNewline -Encoding utf8

          $manifestPath = 'packaging/msix/AppxManifest.xml'
          $manifest = Get-Content $manifestPath -Raw -Encoding utf8
          $manifest = $manifest -replace '(?m)^(\s+)Version="[^"]+"', "`${1}Version=`"$env:STORE_VERSION.0`""
          Set-Content $manifestPath $manifest -NoNewline -Encoding utf8

      - name: Verify temporary versions
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw -Encoding utf8 | ConvertFrom-Json).version
          $cargoVersion = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          [xml]$manifest = Get-Content packaging/msix/AppxManifest.xml -Raw -Encoding utf8
          $manifestVersion = $manifest.Package.Identity.Version

          if ($packageVersion -ne $env:STORE_VERSION -or $cargoVersion -ne $env:STORE_VERSION) {
            throw "Temporary application versions do not match $env:STORE_VERSION."
          }
          if ($manifestVersion -ne "$env:STORE_VERSION.0") {
            throw "MSIX manifest version must be $env:STORE_VERSION.0, got $manifestVersion."
          }

      - name: Build executable only (no NSIS or MSI)
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
        run: npm run tauri build -- --no-bundle --ci

      - name: Prepare resources normally created by the bundler
        shell: pwsh
        run: |
          $resourcesPath = 'src-tauri/target/release/resources'
          New-Item -ItemType Directory -Path $resourcesPath -Force | Out-Null
          Copy-Item -LiteralPath 'src-tauri/icons/icon.ico' -Destination "$resourcesPath/icon.ico" -Force

      - name: Build unsigned Store MSIX
        run: powershell -ExecutionPolicy Bypass -File packaging\msix\build-msix.ps1

      - name: Validate Store MSIX
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File packaging\msix\validate-msix.ps1 `
            -PackagePath packaging\msix\out\ore-no-fusen.msix `
            -ExpectedVersion "$env:STORE_VERSION.0"

      - name: Upload private Store submission artifact
        uses: actions/upload-artifact@v4
        with:
          name: store-msix
          path: packaging/msix/out/ore-no-fusen.msix
          if-no-files-found: error
          retention-days: 30

      - name: Confirm no publication occurred
        shell: pwsh
        run: |
          Write-Host "Private Store package created for $env:STORE_VERSION."
          Write-Host "No tag, GitHub Release, NSIS/MSI bundle, updater metadata, LP deployment, or repository commit was created."
