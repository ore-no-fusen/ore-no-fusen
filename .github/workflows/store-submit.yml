name: Microsoft Store Submit

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release tag to submit, for example v3.6.2'
        required: true
        type: string
      package_pattern:
        description: 'Release asset glob for the Store MSIX package'
        required: true
        default: '*.msix'
        type: string
      product_id:
        description: 'Optional Store product ID. If empty, vars.MICROSOFT_STORE_PRODUCT_ID is used.'
        required: false
        type: string
      submit_to_store:
        description: 'Actually publish the package to Partner Center'
        required: true
        default: false
        type: boolean
      safety_ack:
        description: 'Required to publish: type FIRST_STORE_SUBMISSION_PASSED'
        required: false
        type: string

permissions:
  contents: read

jobs:
  store-submit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download MSIX from GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PACKAGE_PATTERN: ${{ inputs.package_pattern }}
        run: |
          New-Item -ItemType Directory -Force release-store | Out-Null
          gh release download $env:RELEASE_TAG --pattern $env:PACKAGE_PATTERN --dir release-store

          $packages = @(Get-ChildItem release-store -File | Where-Object {
            $_.Extension -in @('.msix', '.msixbundle', '.msixupload', '.appx', '.appxbundle', '.appxupload')
          })

          if ($packages.Count -ne 1) {
            Write-Host "Downloaded files:"
            Get-ChildItem release-store -File | Format-Table Name, Length
            throw "Expected exactly one Store package, found $($packages.Count). Adjust package_pattern."
          }

          "STORE_PACKAGE=$($packages[0].FullName)" >> $env:GITHUB_ENV
          Write-Host "Selected Store package: $($packages[0].FullName)"

      - name: Dry run summary
        if: ${{ !inputs.submit_to_store }}
        shell: pwsh
        env:
          PRODUCT_ID: ${{ inputs.product_id || vars.MICROSOFT_STORE_PRODUCT_ID }}
        run: |
          Write-Host "Dry run only. No Partner Center submission was created."
          Write-Host "Package: $env:STORE_PACKAGE"
          Write-Host "Product ID configured: $([bool]$env:PRODUCT_ID)"
          Write-Host "After the first Store submission is published, rerun with submit_to_store=true and safety_ack=FIRST_STORE_SUBMISSION_PASSED."

      - name: Validate publish inputs
        if: ${{ inputs.submit_to_store }}
        shell: pwsh
        env:
          PRODUCT_ID: ${{ inputs.product_id || vars.MICROSOFT_STORE_PRODUCT_ID }}
          SAFETY_ACK: ${{ inputs.safety_ack }}
        run: |
          if ($env:SAFETY_ACK -ne 'FIRST_STORE_SUBMISSION_PASSED') {
            throw "Refusing to submit. Set safety_ack to FIRST_STORE_SUBMISSION_PASSED after the first Microsoft Store submission is published."
          }

          if ([string]::IsNullOrWhiteSpace($env:PRODUCT_ID)) {
            throw "Missing Store product ID. Set repository variable MICROSOFT_STORE_PRODUCT_ID or provide product_id."
          }

      - name: Configure Microsoft Store CLI
        if: ${{ inputs.submit_to_store }}
        uses: microsoft/microsoft-store-apppublisher@v1.1

      - name: Configure Partner Center credentials
        if: ${{ inputs.submit_to_store }}
        shell: pwsh
        run: |
          msstore reconfigure `
            --tenantId "${{ secrets.AZURE_AD_TENANT_ID }}" `
            --sellerId "${{ secrets.SELLER_ID }}" `
            --clientId "${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}" `
            --clientSecret "${{ secrets.AZURE_AD_APPLICATION_SECRET }}"

      - name: Submit package to Microsoft Store
        if: ${{ inputs.submit_to_store }}
        shell: pwsh
        env:
          PRODUCT_ID: ${{ inputs.product_id || vars.MICROSOFT_STORE_PRODUCT_ID }}
        run: |
          msstore publish "$env:STORE_PACKAGE" -id "$env:PRODUCT_ID"
