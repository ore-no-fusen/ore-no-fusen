name: Prepare and Build Store Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New Store version (for example 5.1.0)'
        required: true
        type: string
      dry_run:
        description: 'Build and validate MSIX without changing main or develop'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: prepare-and-build-store-release
  cancel-in-progress: false

jobs:
  verify-release:
    name: Verify version before changes
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      RAW_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Normalize and validate version
        id: version
        shell: bash
        run: |
          RAW="${RAW_VERSION}"
          RAW="$(echo "$RAW" \
            | sed -e 's/０/0/g' -e 's/１/1/g' -e 's/２/2/g' -e 's/３/3/g' -e 's/４/4/g' \
                  -e 's/５/5/g' -e 's/６/6/g' -e 's/７/7/g' -e 's/８/8/g' -e 's/９/9/g' \
            | sed -e 's/　/ /g' -e 's/[，、．。]/./g' -e 's/,/./g')"
          RAW="$(echo "$RAW" | tr -d '[:space:]')"
          RAW="${RAW#v}"
          RAW="${RAW#V}"
          RAW="$(echo "$RAW" | sed -e 's/\.\+/./g' -e 's/^\.//' -e 's/\.$//')"

          if ! [[ "$RAW" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "Version must be digits and dots only. Got: '${RAW_VERSION}'"
            exit 1
          fi

          IFS='.' read -r MA MI PA <<< "$RAW"
          VERSION="${MA}.${MI:-0}.${PA:-0}"
          CURRENT="$(node -p "require('./package.json').version")"
          if [[ "$(printf '%s\n%s\n' "$VERSION" "$CURRENT" | sort -V | head -1)" == "$VERSION" ]]; then
            echo "New version ($VERSION) must be greater than current version ($CURRENT)."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Verifying develop as v$VERSION before making changes."

      - name: Verify locked dependencies without changes
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          cp src-tauri/Cargo.lock "$RUNNER_TEMP/Cargo.lock.before"
          sed -i "0,/^version = /s/^version = \"[^\"]*\"/version = \"$RELEASE_VERSION\"/" src-tauri/Cargo.toml
          node -e '
            const fs = require("fs");
            const path = "src-tauri/Cargo.lock";
            const lock = fs.readFileSync(path, "utf8");
            const pattern = /(\[\[package\]\]\r?\nname = "ore-no-fusen"\r?\nversion = ")[^"]+/;
            if (!pattern.test(lock)) throw new Error("ore-no-fusen package was not found in Cargo.lock.");
            fs.writeFileSync(path, lock.replace(pattern, `$1${process.env.RELEASE_VERSION}`));
          '
          node scripts/verify-cargo-lock-release.mjs "$RUNNER_TEMP/Cargo.lock.before" src-tauri/Cargo.lock

  prepare-store-release:
    name: Commit verified Store version
    needs: [verify-release]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    outputs:
      main_ref: ${{ steps.main-ref.outputs.main_ref }}
    env:
      VERSION: ${{ needs.verify-release.outputs.version }}
    steps:
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.WINGET_APP_ID }}
          private-key: ${{ secrets.WINGET_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          token: ${{ steps.generate-token.outputs.token }}
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge develop into main
        run: git merge origin/develop --no-ff -m "Merge develop into main for Store v${VERSION}"

      - name: Update versions without dependency resolution
        run: |
          cp src-tauri/Cargo.lock "$RUNNER_TEMP/Cargo.lock.before"
          npm version "$VERSION" --no-git-tag-version --ignore-scripts
          sed -i "0,/^version = /s/^version = \"[^\"]*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          node -e '
            const fs = require("fs");
            const path = "src-tauri/Cargo.lock";
            const lock = fs.readFileSync(path, "utf8");
            const pattern = /(\[\[package\]\]\r?\nname = "ore-no-fusen"\r?\nversion = ")[^"]+/;
            if (!pattern.test(lock)) throw new Error("ore-no-fusen package was not found in Cargo.lock.");
            fs.writeFileSync(path, lock.replace(pattern, `$1${process.env.VERSION}`));
          '
          sed -i -E "s/^([[:space:]]+)Version=\"[^\"]*\"/\1Version=\"${VERSION}.0\"/" packaging/msix/AppxManifest.xml
          node scripts/verify-cargo-lock-release.mjs "$RUNNER_TEMP/Cargo.lock.before" src-tauri/Cargo.lock

      - name: Verify committed versions
        run: |
          PKG="$(node -p "require('./package.json').version")"
          PKG_LOCK="$(node -p "require('./package-lock.json').version")"
          CARGO="$(grep '^version = ' src-tauri/Cargo.toml | head -1 | sed 's/version = "//;s/"//')"
          LOCK="$(node -e "const fs = require('fs'); const lock = fs.readFileSync('src-tauri/Cargo.lock', 'utf8'); const match = lock.match(/\[\[package\]\]\s+name = \"ore-no-fusen\"\s+version = \"([^\"]+)\"/); console.log(match ? match[1] : '');")"
          MSIX="$(grep -E '^[[:space:]]+Version="' packaging/msix/AppxManifest.xml | head -1 | sed -E 's/.*Version="([^"]+)".*/\1/')"
          if [[ "$PKG" != "$VERSION" || "$PKG_LOCK" != "$VERSION" || "$CARGO" != "$VERSION" || "$LOCK" != "$VERSION" || "$MSIX" != "${VERSION}.0" ]]; then
            echo "Version mismatch: package=$PKG package-lock=$PKG_LOCK cargo=$CARGO lock=$LOCK msix=$MSIX"
            exit 1
          fi

      - name: Commit and push main
        run: |
          git add package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock packaging/msix/AppxManifest.xml
          git commit -m "chore: prepare Store version v${VERSION}"
          git push origin main

      - name: Record committed source
        id: main-ref
        run: echo "main_ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Merge main back into develop
        run: |
          git checkout develop
          git merge main
          git push origin develop

  build-store-package:
    name: Build verified Store package
    needs: [verify-release, prepare-store-release]
    if: >-
      ${{
        always() &&
        needs.verify-release.result == 'success' &&
        (inputs.dry_run || needs.prepare-store-release.result == 'success')
      }}
    runs-on: windows-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
      STORE_VERSION: ${{ needs.verify-release.outputs.version }}
      SOURCE_REF: ${{ inputs.dry_run && 'develop (dry run)' || needs.prepare-store-release.outputs.main_ref }}
    steps:
      - name: Checkout Store source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.dry_run && 'develop' || needs.prepare-store-release.outputs.main_ref }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/release/
          key: ${{ runner.os }}-store-release-cargo-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-store-release-cargo-

      - name: Apply version only inside the dry-run workspace
        if: ${{ inputs.dry_run }}
        shell: pwsh
        run: |
          npm version $env:STORE_VERSION --no-git-tag-version --ignore-scripts

          $cargoTomlPath = 'src-tauri/Cargo.toml'
          $cargoToml = Get-Content $cargoTomlPath -Raw -Encoding utf8
          $cargoToml = [regex]::Replace($cargoToml, '(?m)^version = "[^"]+"', "version = `"$env:STORE_VERSION`"", 1)
          Set-Content $cargoTomlPath $cargoToml -Encoding utf8 -NoNewline

          $cargoLockPath = 'src-tauri/Cargo.lock'
          $cargoLock = Get-Content $cargoLockPath -Raw -Encoding utf8
          $cargoPattern = '(?s)(\[\[package\]\]\r?\nname = "ore-no-fusen"\r?\nversion = ")[^"]+'
          if ($cargoLock -notmatch $cargoPattern) { throw 'ore-no-fusen package was not found in Cargo.lock.' }
          $cargoLock = [regex]::Replace($cargoLock, $cargoPattern, { param($match) $match.Groups[1].Value + $env:STORE_VERSION }, 1)
          Set-Content $cargoLockPath $cargoLock -Encoding utf8 -NoNewline

          $manifestPath = 'packaging/msix/AppxManifest.xml'
          $manifest = Get-Content $manifestPath -Raw -Encoding utf8
          $manifest = [regex]::Replace($manifest, '(?m)^(\s+)Version="[^"]+"', { param($match) $match.Groups[1].Value + 'Version="' + $env:STORE_VERSION + '.0"' }, 1)
          Set-Content $manifestPath $manifest -Encoding utf8 -NoNewline

      - name: Verify committed version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw -Encoding utf8 | ConvertFrom-Json).version
          $cargoVersion = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          [xml]$manifest = Get-Content packaging/msix/AppxManifest.xml -Raw -Encoding utf8
          $manifestVersion = $manifest.Package.Identity.Version
          $cargoLock = Get-Content src-tauri/Cargo.lock -Raw -Encoding utf8
          $cargoPattern = '(?s)\[\[package\]\]\r?\nname = "ore-no-fusen"\r?\nversion = "([^"]+)"'
          if ($cargoLock -notmatch $cargoPattern) { throw "ore-no-fusen package was not found in Cargo.lock." }
          $cargoLockVersion = $Matches[1]

          if ($packageVersion -ne $env:STORE_VERSION -or $cargoVersion -ne $env:STORE_VERSION -or $cargoLockVersion -ne $env:STORE_VERSION) {
            throw "Committed application versions must all equal $env:STORE_VERSION."
          }
          if ($manifestVersion -ne "$env:STORE_VERSION.0") {
            throw "MSIX manifest version must be $env:STORE_VERSION.0, got $manifestVersion."
          }

      - run: npm ci

      - name: Build executable only (no NSIS or MSI)
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
        run: npm run tauri build -- --no-bundle --ci

      - name: Prepare resources normally created by the bundler
        shell: pwsh
        run: |
          $resourcesPath = 'src-tauri/target/release/resources'
          New-Item -ItemType Directory -Path $resourcesPath -Force | Out-Null
          Copy-Item -LiteralPath 'src-tauri/icons/icon.ico' -Destination "$resourcesPath/icon.ico" -Force

      - name: Build unsigned Store MSIX
        run: powershell -ExecutionPolicy Bypass -File packaging\msix\build-msix.ps1

      - name: Validate Store MSIX
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File packaging\msix\validate-msix.ps1 `
            -PackagePath packaging\msix\out\ore-no-fusen.msix `
            -ExpectedVersion "$env:STORE_VERSION.0"

      - name: Upload private Store submission artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.dry_run && 'store-msix-dry-run' || 'store-msix' }}
          path: packaging/msix/out/ore-no-fusen.msix
          if-no-files-found: error
          retention-days: 30

      - name: Confirm manual Store submission scope
        shell: pwsh
        run: |
          Write-Host "Store package v$env:STORE_VERSION was created from $env:SOURCE_REF."
          Write-Host "Download this artifact and submit it manually in Microsoft Partner Center."
          Write-Host "No tag, GitHub Release, NSIS/MSI bundle, updater metadata, or Microsoft Store submission was created."

      - name: Confirm dry-run isolation
        if: ${{ inputs.dry_run }}
        shell: pwsh
        run: Write-Host "Dry run completed. No branch, tag, release, or Store submission was changed."
