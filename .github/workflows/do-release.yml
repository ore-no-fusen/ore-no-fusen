name: Do Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version (e.g. 2.10.4)'
        required: true
        type: string
      message:
        description: 'Commit message (optional)'
        required: false
        type: string

jobs:
  do-release:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.WINGET_APP_ID }}
          private-key: ${{ secrets.WINGET_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.generate-token.outputs.token }}
          fetch-depth: 0

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge develop → main
        run: |
          git checkout main
          git merge origin/develop --ff-only

      - name: Update versions
        run: |
          VERSION="${{ github.event.inputs.version }}"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
            pkg.version = '$VERSION';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          node -e "
            const fs = require('fs');
            const conf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8'));
            conf.version = '$VERSION';
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(conf, null, 2) + '\n');
          "
          sed -i "0,/^version = /s/^version = \"[^\"]*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml

      - name: Verify versions
        run: |
          VERSION="${{ github.event.inputs.version }}"
          PKG=$(node -e "console.log(require('./package.json').version)")
          TAURI=$(node -e "console.log(require('./src-tauri/tauri.conf.json').version)")
          CARGO=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/version = "//;s/"//')
          echo "package.json: $PKG"
          echo "tauri.conf.json: $TAURI"
          echo "Cargo.toml: $CARGO"
          if [ "$PKG" != "$VERSION" ] || [ "$TAURI" != "$VERSION" ] || [ "$CARGO" != "$VERSION" ]; then
            echo "❌ Version mismatch!"
            exit 1
          fi
          echo "✅ All versions match: $VERSION"

      - name: Commit and push main
        run: |
          VERSION="${{ github.event.inputs.version }}"
          MSG="${{ github.event.inputs.message }}"
          COMMIT_MSG="${MSG:-chore: バージョンを v${VERSION} に更新}"
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml
          git commit -m "$COMMIT_MSG"
          git push origin main

      - name: Create and push tag
        run: |
          VERSION="${{ github.event.inputs.version }}"
          git tag "v${VERSION}"
          git push origin "v${VERSION}"

      - name: Merge main → develop
        run: |
          git checkout develop
          git merge main
          git push origin develop
