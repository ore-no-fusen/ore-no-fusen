name: Prepare Store Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New Store version (for example 5.1.0)'
        required: true
        type: string
      message:
        description: 'Commit message (optional)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  prepare-store-release:
    runs-on: ubuntu-latest
    env:
      RAW_VERSION: ${{ inputs.version }}
    steps:
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.WINGET_APP_ID }}
          private-key: ${{ secrets.WINGET_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.generate-token.outputs.token }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Normalize and validate version
        run: |
          RAW="${RAW_VERSION}"
          RAW="$(echo "$RAW" \
            | sed -e 's/０/0/g' -e 's/１/1/g' -e 's/２/2/g' -e 's/３/3/g' -e 's/４/4/g' \
                  -e 's/５/5/g' -e 's/６/6/g' -e 's/７/7/g' -e 's/８/8/g' -e 's/９/9/g' \
            | sed -e 's/　/ /g' -e 's/[，、．。]/./g' -e 's/,/./g')"
          RAW="$(echo "$RAW" | tr -d '[:space:]')"
          RAW="${RAW#v}"
          RAW="${RAW#V}"
          RAW="$(echo "$RAW" | sed -e 's/\.\+/./g' -e 's/^\.//' -e 's/\.$//')"

          if ! [[ "$RAW" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "Version must be digits and dots only. Got: '${RAW_VERSION}'"
            exit 1
          fi

          IFS='.' read -r MA MI PA <<< "$RAW"
          VERSION="${MA}.${MI:-0}.${PA:-0}"
          CURRENT="$(node -p "require('./package.json').version")"
          if [[ "$(printf '%s\n%s\n' "$VERSION" "$CURRENT" | sort -V | head -1)" == "$VERSION" ]]; then
            echo "New version ($VERSION) must be greater than current version ($CURRENT)."
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Preparing Store release v$VERSION."

      - name: Merge develop into main
        run: |
          git checkout main
          git merge origin/develop --no-ff -m "Merge develop into main for Store v${VERSION}"

      - name: Update committed release versions without dependency resolution
        run: |
          cp src-tauri/Cargo.lock "$RUNNER_TEMP/Cargo.lock.before"
          npm version "$VERSION" --no-git-tag-version --ignore-scripts
          sed -i "0,/^version = /s/^version = \"[^\"]*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          node -e '
            const fs = require("fs");
            const path = "src-tauri/Cargo.lock";
            const lock = fs.readFileSync(path, "utf8");
            const pattern = /(\[\[package\]\]\r?\nname = "ore-no-fusen"\r?\nversion = ")[^"]+/;
            if (!pattern.test(lock)) throw new Error("ore-no-fusen package was not found in Cargo.lock.");
            fs.writeFileSync(path, lock.replace(pattern, `$1${process.env.VERSION}`));
          '
          sed -i -E "s/^([[:space:]]+)Version=\"[^\"]*\"/\1Version=\"${VERSION}.0\"/" packaging/msix/AppxManifest.xml
          node scripts/verify-cargo-lock-release.mjs "$RUNNER_TEMP/Cargo.lock.before" src-tauri/Cargo.lock

      - name: Verify committed versions
        run: |
          PKG="$(node -p "require('./package.json').version")"
          PKG_LOCK="$(node -p "require('./package-lock.json').version")"
          CARGO="$(grep '^version = ' src-tauri/Cargo.toml | head -1 | sed 's/version = "//;s/"//')"
          LOCK="$(node -e "const fs = require('fs'); const lock = fs.readFileSync('src-tauri/Cargo.lock', 'utf8'); const match = lock.match(/\[\[package\]\]\s+name = \"ore-no-fusen\"\s+version = \"([^\"]+)\"/); console.log(match ? match[1] : '');")"
          MSIX="$(grep -E '^[[:space:]]+Version="' packaging/msix/AppxManifest.xml | head -1 | sed -E 's/.*Version="([^"]+)".*/\1/')"
          if [[ "$PKG" != "$VERSION" || "$PKG_LOCK" != "$VERSION" || "$CARGO" != "$VERSION" || "$LOCK" != "$VERSION" || "$MSIX" != "${VERSION}.0" ]]; then
            echo "Version mismatch: package=$PKG package-lock=$PKG_LOCK cargo=$CARGO lock=$LOCK msix=$MSIX"
            exit 1
          fi

      - name: Commit and push main
        run: |
          MESSAGE="${{ inputs.message }}"
          git add package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock packaging/msix/AppxManifest.xml
          git commit -m "${MESSAGE:-chore: prepare Store version v${VERSION}}"
          git push origin main

      - name: Merge main back into develop
        run: |
          git checkout develop
          git merge main
          git push origin develop

      - name: Confirm Store-only scope
        run: |
          echo "Prepared Store release v$VERSION."
          echo "No tag, GitHub Release, winget update, MSIX upload, or Microsoft Store submission was performed."
