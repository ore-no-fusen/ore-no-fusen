name: MSIX CI
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      prevalidated:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: msix-ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-install-smoke:
    name: Build, install and launch MSIX
    runs-on: windows-latest
    timeout-minutes: 70
    env:
      GDRIVE_CLIENT_ID: msix-ci-placeholder
      GDRIVE_CLIENT_SECRET: msix-ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - name: Prepare noninteractive CI test certificate
        id: certificate
        timeout-minutes: 2
        shell: pwsh
        run: .\scripts\ci-msix-certificate.ps1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install JavaScript dependencies
        id: npm_ci
        timeout-minutes: 5
        run: npm ci
      - name: Frontend unit tests (standalone invocation)
        id: frontend_tests
        if: ${{ !inputs.prevalidated }}
        timeout-minutes: 5
        run: npm test
      - name: Next.js Web and API production build
        id: next_build
        timeout-minutes: 10
        run: npm run build
      - name: Rust all-target tests (standalone invocation)
        id: rust_tests
        if: ${{ !inputs.prevalidated }}
        timeout-minutes: 15
        working-directory: src-tauri
        run: cargo test --locked
      - name: Build Tauri executable without installers
        id: tauri_build
        timeout-minutes: 25
        run: npx tauri build --no-bundle --ci
      - name: Create and sign local test MSIX
        id: msix_create
        timeout-minutes: 5
        shell: pwsh
        run: .\packaging\msix\test-msix.ps1 -SkipBuild -NoInstall
      - name: Verify MSIX signature
        id: msix_verify
        timeout-minutes: 2
        shell: pwsh
        run: |
          $msix = '.\packaging\msix\dev\out\ore-no-fusen-dev.msix'
          $signature = Get-AuthenticodeSignature -LiteralPath $msix
          $expected = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new('.\packaging\msix\dev\certs\ore-no-fusen-dev.cer')
          if ($null -eq $signature.SignerCertificate -or $signature.SignerCertificate.Thumbprint -ne $expected.Thumbprint -or $signature.Status -ne 'Valid') { throw 'MSIX signature is not valid and trusted' }
      - name: Install and launch packaged application
        id: msix_smoke
        timeout-minutes: 3
        shell: pwsh
        run: .\scripts\ci-msix-smoke.ps1 -MsixPath .\packaging\msix\dev\out\ore-no-fusen-dev.msix -CertificatePath .\packaging\msix\dev\certs\ore-no-fusen-dev.cer
      - name: Record run-specific status
        if: always()
        timeout-minutes: 1
        env:
          JOB_STATUS: ${{ job.status }}
          PREVALIDATED: ${{ inputs.prevalidated }}
          STEP_RESULTS: ${{ toJSON(steps) }}
        run: node scripts/msix-status.mjs
      - name: Save status and package for this run only
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: msix-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          retention-days: 1
          if-no-files-found: error
          path: |
            packaging/msix/dev/out/ore-no-fusen-dev.msix
            msix-ci-status.json
            ${{ runner.temp }}/appx-deployment-events.txt
