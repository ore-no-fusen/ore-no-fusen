name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 前回タグ以降のコミット履歴を取得するため

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'components/**', 'lib/**', 'public/**', 'worker/**', 'next.config.*', 'tailwind.config.*', 'postcss.config.*', 'tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-

      - run: npm ci

      - name: Generate release notes
        id: notes
        shell: bash
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/generate-release-notes.mjs

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false

      - name: Build unsigned MSIX
        run: powershell -ExecutionPolicy Bypass -File packaging\msix\build-msix.ps1

      - name: Upload unsigned MSIX
        uses: actions/upload-artifact@v4
        with:
          name: msix-unsigned
          path: packaging/msix/out/ore-no-fusen.msix

  winget:
    needs: release
    runs-on: windows-latest
    steps:
      - name: Close superseded winget PRs
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
          PACKAGE_ID: ONFStudios.OreNoFusen
          FORK_OWNER: ore-no-fusen
          CURRENT_VERSION: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:CURRENT_VERSION -replace '^v', ''
          $items = gh search prs --repo microsoft/winget-pkgs --state open "$env:PACKAGE_ID" --json number,title,url | ConvertFrom-Json

          foreach ($item in $items) {
            $pr = gh api "repos/microsoft/winget-pkgs/pulls/$($item.number)" | ConvertFrom-Json
            $headRef = $pr.head.ref
            $headOwner = $pr.head.repo.owner.login

            if ($headOwner -ne $env:FORK_OWNER) {
              continue
            }
            if (-not $headRef.StartsWith("$env:PACKAGE_ID-")) {
              continue
            }
            if ($headRef.StartsWith("$env:PACKAGE_ID-$version-")) {
              continue
            }

            Write-Output "Closing superseded winget PR #$($pr.number): $($pr.title)"
            gh api -X PATCH "repos/microsoft/winget-pkgs/pulls/$($pr.number)" -f state=closed | Out-Null

            Write-Output "Deleting superseded branch $headRef from $env:FORK_OWNER/winget-pkgs"
            try {
              gh api -X DELETE "repos/$env:FORK_OWNER/winget-pkgs/git/refs/heads/$headRef" | Out-Null
            } catch {
              Write-Output "Branch $headRef was already absent or could not be deleted."
            }
          }

      - uses: vedantmgoyal2009/winget-releaser@v2
        with:
          identifier: ONFStudios.OreNoFusen
          token: ${{ secrets.WINGET_TOKEN }}
          max-versions-to-keep: '0'
