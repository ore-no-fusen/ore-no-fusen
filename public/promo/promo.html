<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Ore-no-Fusen Promo</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body, html {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #fff;
    }

    #stage {
      position: absolute;
      width: 1920px;
      height: 1080px;
      background: #fff;
      overflow: hidden;
      transform-origin: top left;
    }

    /* ===== Characters ===== */
    .char {
      position: absolute;
      width: 300px;
      height: auto;
      left: 50%;
      bottom: 60px;
      transform: translateX(-50%) translateY(140%);
      opacity: 0;
      mix-blend-mode: multiply;
      transition: transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s;
    }
    .char.show {
      transform: translateX(-50%) translateY(0%);
      opacity: 1;
    }
    .char.peek {
      bottom: 0;
      transform: translateX(-50%) translateY(38%);
      opacity: 1;
    }
    @keyframes charBounce {
      0%, 100% { transform: translateX(-50%) translateY(0px); }
      50%       { transform: translateX(-50%) translateY(-20px); }
    }
    .char.bounce { animation: charBounce 1.4s ease-in-out infinite; }

    /* ===== Sticky notes ===== */
    .sticky {
      position: absolute;
      background: #FFE566;
      box-shadow: 5px 5px 14px rgba(0,0,0,0.13);
      border-radius: 5px;
      opacity: 0;
      transition: opacity 0.5s, left 0.9s cubic-bezier(0.34, 1.56, 0.64, 1),
                  top 0.9s cubic-bezier(0.34, 1.56, 0.64, 1),
                  transform 0.9s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .sticky.show { opacity: 1; }
    @keyframes floatNote {
      0%, 100% { transform: translateY(0px)  rotate(var(--r, 0deg)); }
      50%       { transform: translateY(-18px) rotate(var(--r, 0deg)); }
    }
    .sticky.float { animation: floatNote 3s ease-in-out infinite; }
    @keyframes glowNote {
      0%, 100% { box-shadow: 5px 5px 14px rgba(0,0,0,0.13); }
      50%       { box-shadow: 0 0 40px rgba(255,210,0,0.85), 5px 5px 14px rgba(0,0,0,0.13); }
    }
    .sticky.glow { animation: glowNote 1.1s ease-in-out infinite; }

    .sticky-label {
      padding: 18px 16px;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: #444;
      line-height: 1.5;
    }

    /* ===== Chaos symbols ===== */
    .chaos {
      position: absolute;
      opacity: 0;
      font-size: 88px;
      line-height: 1;
      transition: opacity 0.4s;
      user-select: none;
    }
    .chaos.show { opacity: 1; }
    @keyframes chaosFloat {
      0%   { transform: translateY(0)   rotate(-8deg); }
      50%  { transform: translateY(-28px) rotate(8deg); }
      100% { transform: translateY(0)   rotate(-8deg); }
    }
    .chaos.float { animation: chaosFloat 2.2s ease-in-out infinite; }
    @keyframes chaosSpin {
      from { transform: rotate(0deg) scale(1); }
      50%  { transform: rotate(200deg) scale(1.3); }
      to   { transform: rotate(360deg) scale(1); }
    }
    .chaos.spin { animation: chaosSpin 3s linear infinite; }

    /* ===== Text overlays ===== */
    .txt {
      position: absolute;
      width: 1920px;
      left: 0;
      text-align: center;
      font-family: 'Noto Sans JP', sans-serif;
      opacity: 0;
      transition: opacity 0.55s;
      line-height: 1.4;
    }
    .txt.show { opacity: 1; }

    /* ===== App title ===== */
    #appBlock {
      position: absolute;
      width: 1920px;
      left: 0;
      top: 260px;
      text-align: center;
      opacity: 0;
      transition: opacity 0.8s;
    }
    #appBlock.show { opacity: 1; }
    #appTitle {
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 108px;
      font-weight: 900;
      color: #111;
      letter-spacing: 0.02em;
    }
    #appSub {
      margin-top: 20px;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 44px;
      color: #777;
      font-weight: 400;
    }
  </style>
</head>
<body>
<div id="stage">

  <!-- Chaos symbols -->
  <div class="chaos" id="c1" style="left:580px; top:180px; color:#4488FF;">?</div>
  <div class="chaos" id="c2" style="left:1240px; top:220px; color:#4488FF;">?</div>
  <div class="chaos" id="c3" style="left:910px;  top:130px; color:#4488FF;">?</div>
  <div class="chaos" id="sw1" style="left:500px; top:340px; color:#AA66CC; font-size:72px;">〜</div>
  <div class="chaos" id="sw2" style="left:1300px; top:300px; color:#AA66CC; font-size:72px;">〜</div>

  <!-- Sticky notes -->
  <div class="sticky" id="n1" style="width:210px; height:210px; left:540px; top:240px; --r:-9deg;">
    <div class="sticky-label">大事なことは<br>貼っておけばいい</div>
  </div>
  <div class="sticky" id="n2" style="width:190px; height:190px; left:870px; top:200px; --r:6deg;"></div>
  <div class="sticky" id="n3" style="width:200px; height:200px; left:1180px; top:270px; --r:-4deg;"></div>
  <div class="sticky" id="n4" style="width:180px; height:180px; left:720px; top:360px; --r:12deg;"></div>
  <div class="sticky" id="nMain" style="width:240px; height:240px; left:840px; top:330px; --r:0deg;">
    <div class="sticky-label" style="font-size:28px;">💡<br>アイデア</div>
  </div>

  <!-- Scene 1: 困っているユーザー -->
  <div id="userChaos" style="
    position:absolute; left:50%; top:50%;
    transform:translateX(-50%) translateY(-60%) scale(0.5);
    font-size:260px; line-height:1;
    opacity:0;
    transition: opacity 0.5s, transform 0.6s cubic-bezier(0.34,1.56,0.64,1);
  ">😵‍💫</div>

  <!-- Characters -->
  <img class="char" id="charSticky" src="./char-sticky.png" alt="">
  <img class="char" id="charIdea"   src="./char-idea.png" alt="">
  <img class="char" id="charPeek"   src="./char-peek.png" alt="">

  <!-- Text: Scene 2 -->
  <div class="txt" id="tHi"        style="top:150px; font-size:82px; font-weight:900; color:#111;">Hi, I'm Orenofu.</div>
  <div class="txt" id="tCompanion" style="top:270px; font-size:50px; color:#555;">Your sticky note companion.</div>

  <!-- Text: Scene 3 -->
  <div class="txt" id="tNameJP"    style="top:150px; font-size:76px; font-weight:900; color:#111;">俺の名はオレノフ。</div>
  <div class="txt" id="tFairyJP"   style="top:265px; font-size:52px; color:#555;">付箋の妖精だ。</div>
  <div class="txt" id="tOrganize"  style="top:370px; font-size:44px; color:#888;">君の頭の中を、少しだけ整理する。</div>

  <!-- Text: Scene 4 -->
  <div class="txt" id="tWrite"   style="top:160px; font-size:96px; font-weight:900; color:#111;">Write it.</div>
  <div class="txt" id="tMove"    style="top:290px; font-size:96px; font-weight:900; color:#555;">Move it.</div>
  <div class="txt" id="tConnect" style="top:420px; font-size:96px; font-weight:900; color:#999;">Connect it.</div>

  <!-- Text: Scene 5 -->
  <div class="txt" id="tOtoro1"  style="top:140px; font-size:120px; color:#222;">🍣</div>
  <div class="txt" id="tOtoro2"  style="top:290px; font-size:80px; font-weight:900; color:#111;">いいアイデアはすぐ逃げる。</div>
  <div class="txt" id="tOtoroJP" style="top:400px; font-size:80px; font-weight:900; color:#E85;">だから、すぐに貼る。</div>

  <!-- App title block -->
  <div id="appBlock">
    <div id="appTitle">Ore-no-Fusen</div>
    <div id="appSub">Thinking Canvas for your mind</div>
  </div>

</div>

<script>
const $ = id => document.getElementById(id);

function applyScale() {
  const stage = $('stage');
  const scaleX = window.innerWidth  / 1920;
  const scaleY = window.innerHeight / 1080;
  const scale  = Math.min(scaleX, scaleY);
  const offX   = (window.innerWidth  - 1920 * scale) / 2;
  const offY   = (window.innerHeight - 1080 * scale) / 2;
  stage.style.transform = `scale(${scale})`;
  stage.style.left = offX + 'px';
  stage.style.top  = offY + 'px';
}
window.addEventListener('resize', applyScale);
applyScale();

function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

function show(id, ...classes) {
  const el = $(id); if (!el) return;
  el.classList.add('show', ...classes);
}
function hide(id) {
  const el = $(id); if (!el) return;
  el.classList.remove('show', 'bounce', 'float', 'spin', 'glow', 'peek');
  el.style.opacity = '0';
}
function charShow(id, animate = 'bounce') {
  const el = $(id); if (!el) return;
  el.classList.remove('bounce', 'peek');
  el.classList.add('show');
  if (animate) el.classList.add(animate);
}
function charHide(id) {
  const el = $(id); if (!el) return;
  el.classList.remove('show', 'bounce', 'peek');
  el.style.transform = 'translateX(-50%) translateY(110%)';
  el.style.opacity = '0';
}

// 全要素をリセット
function resetAll() {
  ['c1','c2','c3','sw1','sw2','n1','n2','n3','n4','nMain',
   'charSticky','charIdea','charPeek','appBlock',
   'tHi','tCompanion','tNameJP','tFairyJP','tOrganize',
   'tWrite','tMove','tConnect','tOtoro1','tOtoro2','tOtoroJP'
  ].forEach(id => hide(id));

  // 付箋の位置をリセット
  const defaults = {
    n1: {left:'540px', top:'240px'}, n2: {left:'870px', top:'200px'},
    n3: {left:'1180px', top:'270px'}, n4: {left:'720px', top:'360px'},
  };
  Object.entries(defaults).forEach(([id, pos]) => {
    const el = $(id); if (!el) return;
    el.style.left = pos.left; el.style.top = pos.top;
    el.style.transform = '';
  });

  const uc = $('userChaos');
  uc.style.opacity = '0';
  uc.style.transform = 'translateX(-50%) translateY(-60%) scale(0.5)';

  const peek = $('charPeek');
  peek.classList.remove('peek');
  peek.style.transform = 'translateX(-50%) translateY(140%)';
  peek.style.opacity = '0';
}

async function run() {
  while (true) {
    resetAll();
    await wait(600);

    // Scene 1: Chaos
    const uc = $('userChaos');
    uc.style.opacity = '1';
    uc.style.transform = 'translateX(-50%) translateY(-60%) scale(1)';
    await wait(400);
    show('c1', 'float'); await wait(150);
    show('c2', 'float'); await wait(150);
    show('c3', 'float');
    show('sw1', 'spin');
    show('sw2', 'spin');
    await wait(1500);

    // Scene 2: Hi I'm Orenofu
    hide('c1'); hide('c2'); hide('c3'); hide('sw1'); hide('sw2');
    uc.style.opacity = '0';
    uc.style.transform = 'translateX(-50%) translateY(-60%) scale(0.5)';
    await wait(300);
    charShow('charSticky', 'bounce');
    show('n2', 'float');
    await wait(400);
    show('tHi'); await wait(700);
    show('tCompanion'); await wait(1100);

    // Scene 3: 俺の名はオレノフ
    hide('tHi'); hide('tCompanion');
    show('n1', 'float'); await wait(180);
    show('n3', 'float'); await wait(180);
    show('n4', 'float');
    await wait(300);
    show('tNameJP'); await wait(500);
    show('tFairyJP'); await wait(500);
    show('tOrganize'); await wait(1200);

    // Scene 4: Write/Move/Connect
    hide('tNameJP'); hide('tFairyJP'); hide('tOrganize');
    charHide('charSticky');
    [
      {id:'n1', left:'480px', top:'380px'},
      {id:'n2', left:'730px', top:'380px'},
      {id:'n3', left:'980px', top:'380px'},
      {id:'n4', left:'1230px', top:'380px'},
    ].forEach(({id, left, top}) => {
      const el = $(id); if (!el) return;
      el.classList.remove('float');
      el.style.transform = 'rotate(0deg)';
      el.style.left = left; el.style.top = top;
    });
    await wait(950);
    show('tWrite'); await wait(500);
    show('tMove');  await wait(500);
    show('tConnect'); await wait(1200);

    // Scene 5: Idea + 大トロ
    hide('tWrite'); hide('tMove'); hide('tConnect');
    hide('n1'); hide('n2'); hide('n3'); hide('n4');
    await wait(300);
    show('nMain', 'glow');
    charShow('charIdea', 'bounce');
    await wait(500);
    show('tOtoro1'); await wait(800);
    show('tOtoro2'); await wait(600);
    show('tOtoroJP'); await wait(1400);

    // Scene 6: End screen
    hide('tOtoro1'); hide('tOtoro2'); hide('tOtoroJP');
    charHide('charIdea'); hide('nMain');
    await wait(350);
    show('appBlock'); await wait(500);
    $('charPeek').classList.add('peek');
    await wait(2500);

    // フェードアウトして次のループへ
    const stage = $('stage');
    stage.style.transition = 'opacity 0.8s';
    stage.style.opacity = '0';
    await wait(900);
    stage.style.transition = '';
    stage.style.opacity = '1';
    await wait(200);
  }
}

window.addEventListener('load', run);
</script>
</body>
</html>
