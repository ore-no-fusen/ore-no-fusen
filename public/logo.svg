<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="4" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="paperGradient" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF9C3"/>
      <stop offset="100%" stop-color="#FDE047"/>
    </linearGradient>
    <linearGradient id="foldGradient" x1="0" y1="0" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FCD34D"/>
        <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  
  <!-- Main Paper Body -->
  <rect x="60" y="60" width="392" height="392" rx="16" fill="url(#paperGradient)" filter="url(#shadow)"/>
  
  <!-- Folded Corner (Top Right) -->
  <!-- Actually sticky notes usually don't have folded corners unless used. Let's do a slight curl at bottom right maybe? Or just keep it simple and clean. -->
  <!-- Let's do a peeling effect at bottom right -->
  
  <path d="M452 380 L452 436 C452 444.8 444.8 452 436 452 L380 452 L452 380 Z" fill="#EAB308" opacity="0.3"/>
  <path d="M380 452 L452 380 L380 380 C364 380 360 440 380 452 Z" fill="url(#foldGradient)"/>

  <!-- Content Lines (Simulated Text) -->
  <rect x="110" y="140" width="200" height="24" rx="12" fill="#000" fill-opacity="0.1"/>
  <rect x="110" y="190" width="292" height="12" rx="6" fill="#000" fill-opacity="0.1"/>
  <rect x="110" y="220" width="292" height="12" rx="6" fill="#000" fill-opacity="0.1"/>
  <rect x="110" y="250" width="180" height="12" rx="6" fill="#000" fill-opacity="0.1"/>

  <!-- Checkmark/Pin element to make it iconic -->
  <circle cx="256" cy="80" r="16" fill="#EF4444" fill-opacity="0.8"/>
  
</svg>
