<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Circuit Pattern -->
    <pattern id="circuit" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M10 10 H90 V90 H10 Z" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.1"/>
      <path d="M50 0 V100 M0 50 H100" stroke="#22d3ee" stroke-width="1" opacity="0.1"/>
      <circle cx="50" cy="50" r="4" fill="#22d3ee" opacity="0.2"/>
    </pattern>
    
    <!-- Neon Glow Filter -->
    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Text Glow -->
    <filter id="text-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="64" fill="#0f0518"/>
  <rect width="512" height="512" rx="64" fill="url(#circuit)"/>

  <!-- Sticky Note Shape -->
  <g transform="translate(256, 256) rotate(-5) translate(-256, -256)">
    <!-- Fill with low opacity -->
    <rect x="106" y="86" width="300" height="340" rx="8" fill="#facc15" fill-opacity="0.05" stroke="#facc15" stroke-width="6" filter="url(#neon-glow)"/>
    
    <!-- Digital Lines on Note -->
    <path d="M136 130 H376" stroke="#facc15" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="4 4"/>
    <path d="M136 170 H376" stroke="#facc15" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="4 4"/>
    <path d="M136 210 H376" stroke="#facc15" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="4 4"/>
  </g>

  <!-- Text "ONF" -->
  <text x="50%" y="54%" text-anchor="middle" dominant-baseline="middle" 
        font-family="Arial, sans-serif" font-weight="900" font-size="120" 
        fill="#ffffff" style="letter-spacing: 4px; text-shadow: 0 0 20px #facc15;">
    ONF
  </text>
  
  <!-- Accent overlay -->
  <circle cx="420" cy="420" r="120" fill="#a855f7" fill-opacity="0.1" filter="url(#neon-glow)"/>
</svg>
