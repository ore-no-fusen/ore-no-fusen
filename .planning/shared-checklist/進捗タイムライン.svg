<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">進捗の実績と今後の仮予定</title>
  <desc id="desc">日付ごとに完了した作業と、今後の仮の目標日を並べる。予定は安全上の問題などで変わる可能性がある。</desc>
  <defs><style>
    text { font-family: "Yu Gothic UI", "Meiryo", sans-serif; fill: #17243a; }
    .title { font-size: 30px; font-weight: 700; }
    .muted { font-size: 16px; fill: #53647d; }
    .date { font-size: 17px; font-weight: 700; }
    .body { font-size: 17px; }
    .small { font-size: 14px; fill: #53647d; }
  </style></defs>
  <rect width="1280" height="560" fill="#f3f6fb"/>
  <text x="48" y="54" class="title">いつ何をしたか／次はいつどこを目指すか</text>
  <text x="50" y="84" class="muted">実績は確認できた日付。今後は仮の目標日で、試験で問題が見つかれば見直します。</text>

  <rect x="50" y="112" width="570" height="390" rx="18" fill="#e8f7f1" stroke="#9bd2bb"/>
  <text x="78" y="151" font-size="24" font-weight="700" fill="#176b50">ここまでに終わったこと</text>
  <line x1="105" y1="189" x2="105" y2="446" stroke="#75bd9e" stroke-width="4"/>
  <circle cx="105" cy="205" r="11" fill="#16805c"/>
  <text x="132" y="210" class="date">10/14〜15</text>
  <text x="132" y="239" class="body">方針・画面案・通信の順番を決定</text>
  <text x="132" y="263" class="body">架空データでDriveの保存・読取を確認</text>
  <circle cx="105" cy="306" r="11" fill="#16805c"/>
  <text x="132" y="311" class="date">10/15</text>
  <text x="132" y="340" class="body">付箋の識別・変更記録の安全規則を実装</text>
  <text x="132" y="364" class="body">Rust/Webの記録検査テストとレビュー完了</text>
  <circle cx="105" cy="407" r="11" fill="#16805c"/>
  <text x="132" y="412" class="date">10/16（本日）</text>
  <text x="132" y="441" class="body">共通Web・Windows手動上り/下り同期を実装</text>
  <text x="132" y="465" class="body">競合保留・画像検証・共有解除・再試行を追加</text>
  <text x="132" y="489" class="small">対象試験合格。Astra指摘4件を修正し再レビュー完了。最終ビルド再試行はEPERM。</text>

  <rect x="655" y="112" width="575" height="390" rx="18" fill="#fff" stroke="#d9e1ec"/>
  <text x="683" y="151" font-size="24" font-weight="700">これからの目標日（仮）</text>
  <line x1="710" y1="189" x2="710" y2="446" stroke="#c4cfde" stroke-width="4"/>
  <circle cx="710" cy="205" r="11" fill="#e0a32d"/>
  <text x="737" y="210" class="date">10/16（本日）</text>
  <text x="737" y="239" class="body">Astra再レビューと指摘修正（完了）</text>
  <circle cx="710" cy="275" r="10" fill="#aebaca"/>
  <text x="737" y="280" class="date">10/19〜21</text>
  <text x="737" y="309" class="body">実Driveで上り・編集・下り・競合を通し試験</text>
  <circle cx="710" cy="345" r="10" fill="#aebaca"/>
  <text x="737" y="350" class="date">10/22〜26</text>
  <text x="737" y="379" class="body">Android・iPhoneを含む表示・編集を確認</text>
  <circle cx="710" cy="415" r="10" fill="#aebaca"/>
  <text x="737" y="420" class="date">10/27〜30</text>
  <text x="737" y="449" class="body">不具合修正・Astra・端末確認・develop統合</text>
  <text x="737" y="483" class="small">目標：10/30ごろ。実装・試験で問題が出た場合は後ろへ調整。</text>

  <rect x="50" y="518" width="1180" height="28" rx="10" fill="#fff4dc"/>
  <text x="72" y="538" class="small" fill="#805400">これは現在の作業量から置いた仮日程です。日ごとの進み具合を記録して更新します。完成を保証する日付ではありません。</text>
</svg>
