<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>俺の付箋 全体地図 STEP2</title><style>:root{--bg:#f6f7f9;--panel:#fff;--text:#1f2328;--muted:#667085;--border:#d8dde5;--accent:#2563eb;--accent-bg:#eef4ff}*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI","Yu Gothic UI",Meiryo,sans-serif;background:var(--bg);color:var(--text)}main{max-width:1240px;margin:auto;padding:20px}h1{font-size:24px;margin:0 0 4px}.sub{color:var(--muted);margin:0 0 16px}.tabs{display:flex;gap:8px;margin-bottom:14px}.tab{border:1px solid var(--border);background:var(--panel);padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:700}.tab.active{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}.panel{display:none}.panel.active{display:block}iframe{width:100%;height:850px;border:1px solid var(--border);border-radius:14px;background:#fff}.layout{display:grid;grid-template-columns:300px 1fr;gap:16px}.side,.detail{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px}.route-btn{display:block;width:100%;border:0;background:transparent;text-align:left;padding:10px;border-radius:9px;cursor:pointer;color:var(--text)}.route-btn:hover,.route-btn.active{background:var(--accent-bg)}.role{font-size:18px;font-weight:700}.badges{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}.badge{font-size:12px;padding:4px 8px;border-radius:999px;background:var(--accent-bg);color:var(--accent);font-weight:700}.route-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px}.route-node{border:2px solid var(--border);border-radius:12px;padding:10px 12px;background:#fff;min-width:140px}.route-node strong{display:block}.route-node small{color:var(--muted)}.route-node.current{border-color:var(--accent);background:var(--accent-bg)}.route-node.warn{border-color:#e2a21b;background:#fff7df}.arrow{font-weight:900;color:var(--accent)}.checks{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.check{border:1px solid var(--border);border-radius:12px;padding:12px}.check h3{font-size:14px;margin:0 0 8px}.note{margin-top:14px;padding:10px 12px;border-left:4px solid var(--accent);background:var(--accent-bg);border-radius:8px}@media(max-width:800px){.layout,.checks{grid-template-columns:1fr}}</style></head><body><main><h1>俺の付箋 全体地図 <span style="font-size:14px;color:var(--muted)">STEP2</span></h1><p class="sub">STEP1の地図に、機能ごとの流れを追える路線図を追加</p><div class="tabs"><button class="tab active" data-tab="map">地図</button><button class="tab" data-tab="routes">機能ルート</button></div><section id="map" class="panel active"><iframe src="./map-step1.html" title="STEP1 全体地図"></iframe></section><section id="routes" class="panel"><div class="layout"><aside class="side"><h2>機能ルート</h2><button class="route-btn active" data-route="startup">🚀 起動・復元</button><button class="route-btn" data-route="newnote">📝 新規付箋</button><button class="route-btn" data-route="save">💾 Markdown保存</button><button class="route-btn" data-route="image">🖼 画像描き込み保存</button><button class="route-btn" data-route="duplicate">📄 付箋複製</button><button class="route-btn" data-route="sync">☁ PC ↔ iPhone同期</button></aside><section class="detail"><div class="role" id="title"></div><div class="badges" id="badges"></div><div class="route-row" id="row"></div><div class="checks"><div class="check"><h3>この不具合なら見る</h3><ul id="look"></ul></div><div class="check"><h3>通常は見ない</h3><ul id="skip"></ul></div></div><div class="note" id="note"></div></section></div></section></main><script>const routes={startup:{title:'起動・復元ルート',badges:['主担当: page.tsx','危険度 ★★★★★'],nodes:[['Tauri起動','src-tauri',''],['page.tsx','初期化','current'],['設定読込','useSettings',''],['付箋復元','startupRestore','warn'],['Pool生成','invisibleNotePool','warn'],['StickyNote','表示','current']],look:['起動しない','付箋が復元されない','Poolが作られない'],skip:['画像0バイト','Drive認証だけの問題'],note:'起動順序変更は、復元とPoolの両方へ影響しやすい。'},newnote:{title:'新規付箋ルート',badges:['主担当: page.tsx + StickyNote','危険度 ★★★★★'],nodes:[['Ctrl+N','作成要求',''],['page.tsx','Pool選択','current'],['Pool Window','昇格','warn'],['StickyNote','promote受信','current'],['Rust command','lazy作成','warn'],['Markdown','保存','']],look:['新規付箋が出ない','最初の文字が消える','空白付箋'],skip:['既存画像編集','IndexedDB'],note:'PCフロントとRustをまたぐため、片側だけの修正は注意。'},save:{title:'Markdown保存ルート',badges:['主担当: useNoteFile + storage.rs','安全策あり'],nodes:[['Editor','本文',''],['useNoteFile','保存要求','current'],['invoke','fusen_save_note',''],['lib.rs','Rust入口','warn'],['storage.rs','write_note','current'],['temp/backup','原子的保存','']],look:['本文が保存されない','リネーム後の保存失敗','Markdown破損'],skip:['Canvas export','画像直接上書き'],note:'Markdown保存はstorage.rs経由。画像保存とは別ルート。'},image:{title:'画像描き込み保存ルート',badges:['主担当: ImageAnnotationModal + clipboard.rs','NG注意'],nodes:[['画像URL','asset URL',''],['ImageAnnotationModal','画像読込','current'],['Konva Canvas','描画','warn'],['toDataURL','Data URL','warn'],['invoke','保存要求',''],['clipboard.rs','decode','current'],['画像ファイル','fs::write','warn']],look:['描き込み後0バイト','Canvas export失敗','Base64空','画像破損'],skip:['storage.rsのwrite_note','gdrive.rs'],note:'今回のバグのルート。Canvas汚染は未確認、直接上書きは確認対象。'},duplicate:{title:'付箋複製ルート',badges:['主担当: lib.rs + storage.rs','NG注意'],nodes:[['元付箋.md','orig_body',''],['lib.rs','duplicate','current'],['storage.rs','asset copy','current'],['同名assets','skip/共有','warn'],['新付箋.md','本文再利用','warn']],look:['複製後に元画像も変わる','同じassets参照','パス未更新'],skip:['Canvas汚染','Drive認証'],note:'画像名とMarkdown内パスの両方を直す必要がある。'},sync:{title:'PC ↔ iPhone同期ルート',badges:['主担当: gdrive.rs + viewer + worker','危険度 ★★★★★'],nodes:[['PCローカル','md/assets',''],['gdrive.rs','送受信','current'],['Google Drive','中継','warn'],['app/viewer','PWA','current'],['IndexedDB','端末保存',''],['Service Worker','背景処理','warn']],look:['同期されない','PCとiPhoneで内容違い','Pushなし','オフライン不整合'],skip:['PC Window focus','Canvas toDataURL'],note:'PC・Drive・iPhoneのどこで止まったかを分けて確認する。'}};function render(id){const r=routes[id];document.querySelectorAll('.route-btn').forEach(b=>b.classList.toggle('active',b.dataset.route===id));title.textContent=r.title;badges.innerHTML=r.badges.map(v=>`<span class="badge">${v}</span>`).join('');row.innerHTML=r.nodes.map((n,i)=>`${i?'<span class="arrow">→</span>':''}<div class="route-node ${n[2]}"><strong>${n[0]}</strong><small>${n[1]}</small></div>`).join('');look.innerHTML=r.look.map(v=>`<li>${v}</li>`).join('');skip.innerHTML=r.skip.map(v=>`<li>${v}</li>`).join('');note.textContent=r.note}document.querySelectorAll('.route-btn').forEach(b=>b.onclick=()=>render(b.dataset.route));document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));t.classList.add('active');document.getElementById(t.dataset.tab).classList.add('active')});render('startup');</script></body></html>
