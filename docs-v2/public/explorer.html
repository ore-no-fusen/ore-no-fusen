<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>俺の付箋 Explorer</title>
<style>
:root{--bg:#f7f7f8;--panel:#fff;--text:#1f2328;--muted:#667085;--border:#d9dde3;--accent:#2563eb;--accent-bg:#eef4ff}*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI","Yu Gothic UI",Meiryo,sans-serif;background:var(--bg);color:var(--text)}main{max-width:1100px;margin:auto;padding:24px}h1{font-size:24px;margin:0 0 6px}.sub{color:var(--muted);margin:0 0 20px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.module{min-height:74px;padding:12px;border:1px solid var(--border);border-radius:14px;background:var(--panel);text-align:left;cursor:pointer}.module.active{border-color:var(--accent);background:var(--accent-bg)}.name{font-weight:700}.status{font-size:13px;color:var(--muted);margin-top:4px}.detail{margin-top:22px;border-top:1px solid var(--border);padding-top:18px}.badge{display:inline-block;background:var(--accent-bg);color:var(--accent);border-radius:999px;padding:4px 9px;font-size:12px;font-weight:700}h2{font-size:20px;margin:10px 0 4px}.summary{color:var(--muted);margin:0 0 14px}svg{width:100%;height:auto}.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:16px}.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px;margin-top:8px}.card b{display:block;margin-bottom:3px}.small{font-size:13px;color:var(--muted)}.node rect{fill:var(--panel);stroke:var(--border);stroke-width:2}.node text{fill:var(--text);font-size:14px;text-anchor:middle;dominant-baseline:middle}.edge{stroke:var(--accent);stroke-width:2.4;fill:none;marker-end:url(#arrow)}.edge-label{fill:var(--muted);font-size:12px;text-anchor:middle}@media(max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.cols{grid-template-columns:1fr}}
</style>
</head>
<body><main>
<h1>俺の付箋 Explorer</h1>
<p class="sub">見たいところだけ押して、構造・主要ファイル・注意点を確認する簡易設計書</p>
<div class="grid" id="module-grid"></div>
<section class="detail"><span class="badge" id="status-badge"></span><h2 id="detail-title"></h2><p class="summary" id="detail-summary"></p><svg id="diagram" viewBox="0 0 760 330" role="img" aria-label="俺の付箋の構造図"></svg><div class="cols"><div><h3>主要ファイル</h3><div id="files"></div></div><div><h3>変更時の注意</h3><div id="risks"></div></div></div></section>
</main><script>
const modules={
overview:{label:'全体',status:'WATCH',summary:'フロントエンド、Tauri IPC、Rustバックエンド、ファイル保存で構成。全体は維持可能。',files:[['app/page.tsx','全体初期化・ウィンドウ管理'],['StickyNote.tsx','付箋ウィンドウの統合'],['src-tauri/src/lib.rs','Tauriコマンドの入口'],['storage.rs','Markdown・設定・アセットI/O']],risks:['画像保存はMarkdown保存と同じ安全策ではない','付箋複製時の画像共有に注意'],nodes:[['UI',110,80],['Hooks',300,80],['Tauri IPC',490,80],['Rust',650,80],['Markdown / assets',650,240]],edges:[[0,1,'操作'],[1,2,'invoke'],[2,3,'command'],[3,4,'I/O']]},
startup:{label:'起動・Pool',status:'WATCH',summary:'page.tsxが初期化、付箋復元、Poolウィンドウ生成と昇格を調整。',files:[['app/page.tsx','起動オーケストレーター'],['utils/startupRestore.ts','復元処理'],['utils/invisibleNotePool.ts','Pool選択'],['StickyNote.tsx','Pool昇格受信']],risks:['初期化順序を変えると復元・Pool生成へ影響','イベント送信先とウィンドウ固有listenを混同しない'],nodes:[['Tauri起動',90,80],['page.tsx',260,80],['付箋復元',440,40],['Pool生成',440,130],['StickyNote',650,85]],edges:[[0,1,'開始'],[1,2,'restore'],[1,3,'prepare'],[2,4,'表示'],[3,4,'promote']]},
sticky:{label:'付箋本体',status:'WATCH',summary:'StickyNote.tsxは多数のHookとUI部品を統合する中心コンポーネント。',files:[['StickyNote.tsx','各Hook・イベント・UIの統合'],['useNoteFile.ts','読込・保存'],['useWindowManager.ts','Window状態'],['useEditMode.ts','編集状態']],risks:['大規模分割より、対象機能だけを切り出す','Pool・Alt+Tab・フォーカス処理は相互影響あり'],nodes:[['StickyNote',360,55],['useNoteFile',110,190],['useWindowManager',290,190],['useEditMode',470,190],['UI部品',650,190]],edges:[[0,1,'保存'],[0,2,'Window'],[0,3,'編集'],[0,4,'表示']]},
save:{label:'保存',status:'OK寄り',summary:'Markdown保存は一時ファイルとバックアップを使い、失敗時に元データを保護。',files:[['useNoteFile.ts','保存要求'],['src-tauri/src/lib.rs','fusen_save_note'],['storage.rs','write_note'],['logic.rs','frontmatter処理']],risks:['画像保存には同じアトミック処理が適用されていない','保存先変更時はリネーム後のpath同期を確認'],nodes:[['Editor',80,90],['useNoteFile',250,90],['fusen_save_note',440,90],['write_note',640,90],['temp',540,240],['本番.md',700,240]],edges:[[0,1,'保存'],[1,2,'invoke'],[2,3,'I/O'],[3,4,'一時保存'],[4,5,'置換']]},
image:{label:'画像',status:'NGあり',summary:'CanvasからBase64を生成しRustで直接画像ファイルへ上書き。破損防止が不足。',files:[['ImageAnnotationModal.tsx','Konva・Canvas・toDataURL'],['clipboard.rs','Base64デコードと画像保存'],['MarkdownRenderer.tsx','画像表示とリンク処理']],risks:['空データ・PNG妥当性の検証がない','一時ファイル保存とロールバックがない','Canvas汚染の原因は実機ログで確認が必要'],nodes:[['画像URL',80,90],['Konva Canvas',245,90],['toDataURL',410,90],['clipboard.rs',570,90],['元画像へ上書き',680,240]],edges:[[0,1,'読込'],[1,2,'export'],[2,3,'invoke'],[3,4,'fs::write']]},
duplicate:{label:'複製',status:'NG',summary:'複製元と複製先が同じassetsパスを参照する構造が確認されている。',files:[['src-tauri/src/lib.rs','fusen_duplicate_note'],['storage.rs','copy_associated_assets'],['Markdown本文','assets/...の参照']],risks:['orig_bodyをそのまま再利用している','同名アセットはコピーをスキップ','複製後のMarkdownパスを書き換えていない'],nodes:[['元付箋.md',90,70],['orig_body',270,70],['複製付箋.md',490,70],['assets/image.png',290,240],['両方が参照',600,240]],edges:[[0,1,'読込'],[1,2,'そのまま保存'],[0,3,'参照'],[2,3,'同じ参照'],[3,4,'共有']]},
windowCtl:{label:'Window制御',status:'WATCH',summary:'1付箋＝1Tauriウィンドウ。page.tsxとStickyNote、Window Hookが協調。',files:[['app/page.tsx','Window作成・復元'],['useWindowManager.ts','位置・サイズ・最小化'],['StickyNote.tsx','focus・close・Alt+Tab'],['src-tauri/src/lib.rs','Windows API連携']],risks:['closeリスナー再登録で一瞬外れる問題に注意','Poolウィンドウと通常付箋を混同しない'],nodes:[['page.tsx',100,80],['Tauri Window',300,80],['StickyNote',500,80],['Window Hook',500,230],['Windows API',700,150]],edges:[[0,1,'生成'],[1,2,'表示'],[2,3,'状態'],[3,4,'操作'],[0,4,'Rust']]},
rust:{label:'Rust',status:'OK寄り',summary:'lib.rsが入口、logic.rsが純粋処理、storage.rsがI/Oを担当。',files:[['lib.rs','Tauriコマンド・状態調整'],['logic.rs','副作用の少ないロジック'],['storage.rs','ファイルI/O'],['gdrive.rs','Google Drive'],['clipboard.rs','画像・Clipboard']],risks:['logic.rsへI/Oを入れない','storage.rs以外にも直接fs::writeが存在するため個別確認が必要'],nodes:[['lib.rs',360,50],['logic.rs',100,210],['storage.rs',270,210],['gdrive.rs',450,210],['clipboard.rs',630,210]],edges:[[0,1,'計算'],[0,2,'I/O'],[0,3,'同期'],[0,4,'画像']]}}
const grid=document.getElementById('module-grid'),title=document.getElementById('detail-title'),summary=document.getElementById('detail-summary'),badge=document.getElementById('status-badge'),files=document.getElementById('files'),risks=document.getElementById('risks'),svg=document.getElementById('diagram');
Object.entries(modules).forEach(([key,m])=>{const b=document.createElement('button');b.type='button';b.className='module';b.dataset.key=key;b.innerHTML=`<div class="name">${m.label}</div><div class="status">${m.status}</div>`;b.addEventListener('click',()=>render(key));grid.appendChild(b)});
function render(key){const m=modules[key];document.querySelectorAll('.module').forEach(b=>b.classList.toggle('active',b.dataset.key===key));title.textContent=m.label;summary.textContent=m.summary;badge.textContent=m.status;files.innerHTML=m.files.map(([a,b])=>`<div class="card"><b>${a}</b><div class="small">${b}</div></div>`).join('');risks.innerHTML=m.risks.map(r=>`<div class="card">${r}</div>`).join('');draw(m)}
function draw(m){const defs=`<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--accent)"></path></marker></defs>`;const ns=m.nodes.map(([n,x,y])=>`<g class="node"><rect x="${x-65}" y="${y-24}" width="130" height="48" rx="12"></rect><text x="${x}" y="${y}">${n}</text></g>`).join('');const es=m.edges.map(([a,b,l])=>{const n1=m.nodes[a],n2=m.nodes[b],x1=n1[1],y1=n1[2],x2=n2[1],y2=n2[2];return `<path class="edge" d="M${x1} ${y1+28}L${x2} ${y2-28}"></path><text class="edge-label" x="${(x1+x2)/2}" y="${(y1+y2)/2-5}">${l}</text>`}).join('');svg.innerHTML=defs+es+ns}render('overview');
</script></body></html>
