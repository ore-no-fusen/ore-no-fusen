<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>俺の付箋 地図</title><style>:root{--bg:#f6f7f9;--panel:#fff;--text:#1f2328;--muted:#667085;--border:#d8dde5;--accent:#2563eb;--accent-bg:#eef4ff}*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI","Yu Gothic UI",Meiryo,sans-serif;background:var(--bg);color:var(--text)}main{max-width:1180px;margin:auto;padding:20px}h1{font-size:24px;margin:0 0 4px}.sub{color:var(--muted);margin:0 0 16px}.layout{display:grid;grid-template-columns:320px 1fr;gap:16px}.tree,.detail{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px}.tree h2,.detail h2{font-size:17px;margin:0 0 10px}.node-btn{display:block;width:100%;border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:9px;cursor:pointer;color:var(--text)}.node-btn:hover,.node-btn.active{background:var(--accent-bg)}.indent1{padding-left:28px}.indent2{padding-left:48px}.folder{font-weight:700}.file{font-family:Consolas,"Courier New",monospace;font-size:13px}.badges{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}.badge{font-size:12px;padding:4px 8px;border-radius:999px;background:var(--accent-bg);color:var(--accent);font-weight:700}.role{font-size:18px;font-weight:700;margin-bottom:4px}.path{font-family:Consolas,"Courier New",monospace;color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.box{border:1px solid var(--border);border-radius:12px;padding:12px;background:#fff}.box h3{font-size:14px;margin:0 0 8px}ul{margin:0;padding-left:20px}li{margin:5px 0}.flow{margin-top:14px;border-top:1px solid var(--border);padding-top:14px}.flowline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.step{border:1px solid var(--border);border-radius:10px;padding:8px 10px;background:#fff;font-size:13px}.arrow{color:var(--accent);font-weight:700}.note{margin-top:14px;padding:10px 12px;border-left:4px solid var(--accent);background:var(--accent-bg);border-radius:8px}@media(max-width:820px){.layout{grid-template-columns:1fr}.grid{grid-template-columns:1fr}}</style></head><body><main><h1>俺の付箋 地図</h1><p class="sub">全部読むための設計書ではなく、「どこに何があるか」をつかむための地図</p><div class="layout"><aside class="tree"><h2>フォルダ階層</h2><div id="tree"></div></aside><section class="detail"><div class="role" id="title"></div><div class="path" id="path"></div><div class="badges" id="badges"></div><div class="grid"><div class="box"><h3>ここで担当する</h3><ul id="does"></ul></div><div class="box"><h3>ここでは担当しない</h3><ul id="notdoes"></ul></div><div class="box"><h3>主に呼ばれる場所</h3><ul id="calledby"></ul></div><div class="box"><h3>変更すると影響する</h3><ul id="impact"></ul></div></div><div class="flow"><h3>処理の流れ</h3><div class="flowline" id="flow"></div></div><div class="note" id="note"></div></section></div></main><script>const items=[{id:'app',label:'📁 app/',level:0,type:'folder',title:'フロントエンド全体',path:'app/',badges:['理解優先 ★★★★★','壊すと危険 ★★★★☆'],does:['画面表示','ユーザー操作','Tauriへの命令'],notdoes:['直接のファイルI/O','Windows APIの実装'],calledby:['Next.js / Tauri WebView'],impact:['画面全体','付箋操作','起動フロー'],flow:['ユーザー操作','React','invoke','Rust'],note:'UI側の入口。バグが見た目・操作・Canvasなら、まずここを見る。'},{id:'page',label:'📄 page.tsx',level:1,type:'file',title:'アプリ全体の司令塔',path:'app/page.tsx',badges:['理解優先 ★★★★★','壊すと危険 ★★★★★'],does:['起動処理','付箋ウィンドウ生成','Pool管理','全体イベント'],notdoes:['画像データの保存本体','Markdown解析の詳細'],calledby:['Tauri起動時','メインウィンドウ'],impact:['起動','復元','Pool','新規付箋作成'],flow:['起動','設定読込','付箋復元','Pool生成','表示'],note:'起動やPoolの不具合ならここ。画像編集だけの不具合なら通常は主原因ではない。'},{id:'components',label:'📁 components/',level:1,type:'folder',title:'画面部品',path:'app/components/',badges:['理解優先 ★★★★★','壊すと危険 ★★★★☆'],does:['付箋表示','エディタ','画像描き込み','ダイアログ'],notdoes:['Rust側ファイル保存','Google Drive通信本体'],calledby:['page.tsx','他のcomponents'],impact:['UI','入力','表示','画像編集'],flow:['操作','Component','Hook / invoke'],note:'見た目や操作のバグはここから探す。'},{id:'sticky',label:'📄 StickyNote.tsx',level:2,type:'file',title:'付箋1枚の統合役',path:'app/components/StickyNote.tsx',badges:['理解優先 ★★★★★','壊すと危険 ★★★★★'],does:['Hook統合','付箋UI','イベント調整','Window連携'],notdoes:['低レベルの保存実装','純粋なMarkdown解析'],calledby:['page.tsx'],impact:['付箋全体','編集','フォーカス','Pool昇格'],flow:['付箋表示','Hook','invoke','Rust'],note:'付箋全体の挙動がおかしい時の中心。すでに多くの処理はHookへ分離されている。'},{id:'imageModal',label:'📄 ImageAnnotationModal.tsx',level:2,type:'file',title:'画像への描き込み',path:'app/components/ImageAnnotationModal.tsx',badges:['理解優先 ★★★★☆','壊すと危険 ★★★★★'],does:['画像読込','Konva Canvas','描き込み','toDataURL'],notdoes:['最終的なファイル書込','Markdown保存'],calledby:['StickyNote.tsx'],impact:['画像描き込み','Canvas export'],flow:['画像URL','Canvas','toDataURL','invoke'],note:'画像の描き込み・出力がおかしい場合に見る。最終保存はRust側。'},{id:'hooks',label:'📁 hooks/',level:1,type:'folder',title:'React状態と操作の分離',path:'app/hooks/',badges:['理解優先 ★★★★☆','壊すと危険 ★★★★☆'],does:['保存状態','編集状態','Window状態','イベント処理'],notdoes:['画面の細かい見た目','Rust実装'],calledby:['StickyNote.tsx','page.tsx'],impact:['状態遷移','保存','Window操作'],flow:['Component','Hook','API / invoke'],note:'UIから処理を分離する場所。バグの経路を追う時の中継地点。'},{id:'useNoteFile',label:'📄 useNoteFile.ts',level:2,type:'file',title:'付箋ファイルの読込・保存窓口',path:'app/hooks/useNoteFile.ts',badges:['理解優先 ★★★★★','壊すと危険 ★★★★★'],does:['ノート読込','保存要求','path更新','保存失敗処理'],notdoes:['Rustの実ファイル書込','Window生成'],calledby:['StickyNote.tsx'],impact:['保存','リネーム','自動保存'],flow:['Editor','useNoteFile','fusen_save_note','storage.rs'],note:'Markdown保存のバグなら重要。画像の直接保存とは別経路。'},{id:'api',label:'📁 api/',level:1,type:'folder',title:'Tauriコマンドのラッパー',path:'app/api/',badges:['理解優先 ★★★☆☆','壊すと危険 ★★★☆☆'],does:['invokeの関数化','型付け'],notdoes:['画面描画','ファイルI/O'],calledby:['components','hooks','page.tsx'],impact:['Rustとの通信'],flow:['UI / Hook','API wrapper','invoke','Rust'],note:'すべてのinvokeがここに集約されているわけではない。'},{id:'utils',label:'📁 utils/',level:1,type:'folder',title:'フロント共通処理',path:'app/utils/',badges:['理解優先 ★★★☆☆','壊すと危険 ★★★☆☆'],does:['文字列処理','パス処理','小さな判定関数'],notdoes:['画面状態','ファイルI/O'],calledby:['app内の各所'],impact:['複数UIの共通挙動'],flow:['Component / Hook','utility','結果を返す'],note:'小さな共通処理の場所。副作用は少ない方がよい。'},{id:'tauri',label:'📁 src-tauri/src/',level:0,type:'folder',title:'Rustバックエンド',path:'src-tauri/src/',badges:['理解優先 ★★★★★','壊すと危険 ★★★★★'],does:['ファイルI/O','Window / OS操作','同期','Tauriコマンド'],notdoes:['React表示','Canvas描画'],calledby:['フロントエンドのinvoke'],impact:['保存','起動','Window','同期','画像'],flow:['invoke','lib.rs','各モジュール','OS / File'],note:'ファイルが壊れる、Windowが動かない、同期がおかしい場合はここ。'},{id:'lib',label:'📄 lib.rs',level:1,type:'file',title:'Rust側の司令塔',path:'src-tauri/src/lib.rs',badges:['理解優先 ★★★★★','壊すと危険 ★★★★★'],does:['Tauriコマンド','状態調整','各モジュール呼出し'],notdoes:['UI表示','すべてのI/O詳細'],calledby:['Tauri invoke'],impact:['ほぼ全機能'],flow:['invoke','lib.rs','storage / logic / gdrive / clipboard'],note:'どのRust処理へ流れるかを知る入口。複製処理もここにある。'},{id:'storage',label:'📄 storage.rs',level:1,type:'file',title:'ファイル保存と読込',path:'src-tauri/src/storage.rs',badges:['理解優先 ★★★★★','壊すと危険 ★★★★★'],does:['Markdown保存','設定保存','アセットコピー','バックアップ'],notdoes:['Canvas処理','UI','Window操作'],calledby:['lib.rs','他のRustモジュール'],impact:['保存','複製','設定','データ保護'],flow:['lib.rs','storage.rs','temp / backup','本番ファイル'],note:'Markdown保存やアセットコピーを担当。画像の直接保存はclipboard.rs側も確認する。'},{id:'logic',label:'📄 logic.rs',level:1,type:'file',title:'副作用の少ない計算・解析',path:'src-tauri/src/logic.rs',badges:['理解優先 ★★★★☆','壊すと危険 ★★★☆☆'],does:['frontmatter解析','ファイル名生成','整列計算'],notdoes:['ファイルI/O','OS操作'],calledby:['lib.rs','storage.rs'],impact:['命名','メタデータ','整列'],flow:['入力','logic.rs','計算結果'],note:'I/Oを追加する提案は要注意。'},{id:'clipboard',label:'📄 clipboard.rs',level:1,type:'file',title:'画像・クリップボード処理',path:'src-tauri/src/clipboard.rs',badges:['理解優先 ★★★★☆','壊すと危険 ★★★★★'],does:['クリップボード画像取得','画像Base64デコード','画像ファイル保存'],notdoes:['Canvas描画','Markdown本文保存'],calledby:['ImageAnnotationModal.tsx','画像貼付処理'],impact:['画像貼付','画像描き込み保存'],flow:['dataURL','Base64 decode','fs::write','画像ファイル'],note:'画像保存がおかしい時のRust側の中心。'},{id:'gdrive',label:'📄 gdrive.rs',level:1,type:'file',title:'Google Drive同期',path:'src-tauri/src/gdrive.rs',badges:['理解優先 ★★★☆☆','壊すと危険 ★★★★★'],does:['Drive認証','アップロード','ダウンロード','同期'],notdoes:['通常のローカル保存','UI表示'],calledby:['lib.rs','同期タスク'],impact:['PCとiPhoneの同期'],flow:['ローカル','gdrive.rs','Google Drive','iPhone / PC'],note:'同期の不具合だけを見る場所。通常の画像描き込み保存とは別経路。'}];const tree=document.getElementById('tree'),byId=Object.fromEntries(items.map(x=>[x.id,x]));items.forEach(item=>{const b=document.createElement('button');b.className='node-btn '+(item.type==='folder'?'folder':'file')+' indent'+item.level;b.textContent=item.label;b.dataset.id=item.id;b.addEventListener('click',()=>show(item.id));tree.appendChild(b)});function list(el,values){el.innerHTML=values.map(v=>`<li>${v}</li>`).join('')}function show(id){const x=byId[id];document.querySelectorAll('.node-btn').forEach(b=>b.classList.toggle('active',b.dataset.id===id));document.getElementById('title').textContent=x.title;document.getElementById('path').textContent=x.path;document.getElementById('badges').innerHTML=x.badges.map(v=>`<span class="badge">${v}</span>`).join('');list(document.getElementById('does'),x.does);list(document.getElementById('notdoes'),x.notdoes);list(document.getElementById('calledby'),x.calledby);list(document.getElementById('impact'),x.impact);document.getElementById('flow').innerHTML=x.flow.map((v,i)=>`${i?'<span class="arrow">→</span>':''}<span class="step">${v}</span>`).join('');document.getElementById('note').textContent=x.note}show('app');</script></body></html>
