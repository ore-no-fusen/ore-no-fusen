<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="425" viewBox="0 0 1140 425" role="img" aria-label="S03 タグ自体の管理：付箋への付け外しとは別の小画面"><rect width="1140" height="425" fill="#f2f6fa"/><g font-family="Yu Gothic,Meiryo,sans-serif"><text x="24" y="38" fill="#243c52" font-size="25">S03 タグ自体の管理：付箋への付け外しとは別の小画面</text><text x="24" y="70" fill="#243c52" font-size="17">タグ列の＋、またはタグの右クリックから表示する追加案です。</text><rect x="20" y="95" width="350" height="300" rx="10" fill="#fff" stroke="#b6c4d0"/><rect x="20" y="95" width="350" height="50" rx="10" fill="#dcebf6" stroke="#b6c4d0"/><text x="36" y="128" fill="#243c52" font-size="21">G01 タグを追加</text><text x="36" y="185" fill="#243c52" font-size="18">タグ名</text><rect x="36" y="204" width="318" height="45" rx="10" fill="#f6f9fb" stroke="#b6c4d0"/><text x="48" y="233" fill="#243c52" font-size="19">旅行</text><text x="36" y="284" fill="#243c52" font-size="17">使用0件でも作成して残す</text><rect x="36" y="320" width="150" height="44" rx="10" fill="#e9f1f7" stroke="#b6c4d0"/><text x="58" y="348" fill="#243c52" font-size="17">キャンセル</text><rect x="202" y="320" width="150" height="44" rx="10" fill="#d6ecff" stroke="#b6c4d0"/><text x="244" y="348" fill="#243c52" font-size="17">作成</text><rect x="395" y="95" width="350" height="300" rx="10" fill="#fff" stroke="#b6c4d0"/><rect x="395" y="95" width="350" height="50" rx="10" fill="#dcebf6" stroke="#b6c4d0"/><text x="411" y="128" fill="#243c52" font-size="21">G02 タグ名を変更</text><text x="411" y="185" fill="#243c52" font-size="18">test の新しい名前</text><rect x="411" y="204" width="318" height="45" rx="10" fill="#f6f9fb" stroke="#b6c4d0"/><text x="423" y="233" fill="#243c52" font-size="19">調査</text><text x="411" y="284" fill="#243c52" font-size="17">使用している付箋にも反映</text><rect x="411" y="320" width="150" height="44" rx="10" fill="#e9f1f7" stroke="#b6c4d0"/><text x="433" y="348" fill="#243c52" font-size="17">キャンセル</text><rect x="577" y="320" width="150" height="44" rx="10" fill="#d6ecff" stroke="#b6c4d0"/><text x="619" y="348" fill="#243c52" font-size="17">変更</text><rect x="770" y="95" width="350" height="300" rx="10" fill="#fff" stroke="#b6c4d0"/><rect x="770" y="95" width="350" height="50" rx="10" fill="#dcebf6" stroke="#b6c4d0"/><text x="786" y="128" fill="#243c52" font-size="21">G03 タグを削除</text><text x="786" y="185" fill="#243c52" font-size="19">「test」を削除しますか？</text><text x="786" y="222" fill="#243c52" font-size="18">対象：○件の付箋</text><text x="786" y="260" fill="#243c52" font-size="17">付箋本体と登録は残ります。</text><rect x="786" y="320" width="150" height="44" rx="10" fill="#e9f1f7" stroke="#b6c4d0"/><text x="808" y="348" fill="#243c52" font-size="17">キャンセル</text><rect x="952" y="320" width="150" height="44" rx="10" fill="#fff0e5" stroke="#b6c4d0"/><text x="994" y="348" fill="#243c52" font-size="17">削除</text></g></svg>