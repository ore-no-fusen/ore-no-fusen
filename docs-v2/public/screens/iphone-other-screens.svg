<svg xmlns="http://www.w3.org/2000/svg" width="920" height="1080" viewBox="0 0 920 1080" role="img" aria-labelledby="title desc">
  <title id="title">iPhone PWAのbanner、login、push、write画面</title>
  <desc id="desc">画面ID付きで、インストール案内、ログイン、通知設定、編集の4画面を示す。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#0f172a" flood-opacity=".17"/>
    </filter>
  </defs>
  <rect width="920" height="1080" rx="24" fill="#f8fafc"/>
  <text x="50" y="52" font-family="sans-serif" font-size="25" font-weight="700" fill="#0f172a">iPhone PWA　画面イメージ</text>

  <!-- banner -->
  <g transform="translate(55 88)">
    <text x="0" y="0" font-family="sans-serif" font-size="21" font-weight="700" fill="#0f172a">画面ID: banner　インストール案内</text>
    <g filter="url(#shadow)">
      <rect x="45" y="28" width="300" height="405" rx="36" fill="#111827"/>
      <rect x="57" y="40" width="276" height="381" rx="27" fill="#f2f2f7"/>
      <rect x="145" y="49" width="100" height="18" rx="9" fill="#111827"/>
    </g>
    <text x="195" y="104" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#111827">ホーム画面に追加してください</text>
    <g font-family="sans-serif">
      <rect x="78" y="126" width="234" height="64" rx="12" fill="#fff" stroke="#d7dce3"/>
      <text x="95" y="151" font-size="14" font-weight="700" fill="#3156c8">STEP 1</text>
      <text x="95" y="174" font-size="14" fill="#334155">共有ボタンをタップ</text>
      <rect x="78" y="205" width="234" height="64" rx="12" fill="#fff" stroke="#d7dce3"/>
      <text x="95" y="230" font-size="14" font-weight="700" fill="#3156c8">STEP 2</text>
      <text x="95" y="253" font-size="14" fill="#334155">ホーム画面に追加</text>
      <rect x="78" y="284" width="234" height="64" rx="12" fill="#fff" stroke="#d7dce3"/>
      <text x="95" y="309" font-size="14" font-weight="700" fill="#3156c8">STEP 3</text>
      <text x="95" y="332" font-size="14" fill="#334155">「追加」をタップ</text>
      <text x="310" y="397" text-anchor="end" font-size="10" fill="#94a3b8">app 2.9.x</text>
    </g>
  </g>

  <!-- login -->
  <g transform="translate(485 88)">
    <text x="0" y="0" font-family="sans-serif" font-size="21" font-weight="700" fill="#0f172a">画面ID: login　ログイン</text>
    <g filter="url(#shadow)">
      <rect x="20" y="28" width="300" height="405" rx="36" fill="#111827"/>
      <rect x="32" y="40" width="276" height="381" rx="27" fill="#fff"/>
      <rect x="120" y="49" width="100" height="18" rx="9" fill="#111827"/>
    </g>
    <text x="170" y="157" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="700" fill="#111827">俺の付箋</text>
    <text x="170" y="207" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#475569">Googleでログインしてください</text>
    <rect x="65" y="240" width="210" height="55" rx="12" fill="#4f6fe8"/>
    <text x="170" y="275" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#fff">Googleでログイン</text>
    <text x="285" y="397" text-anchor="end" font-family="sans-serif" font-size="10" fill="#94a3b8">app 2.9.x / ServiceWorker 2.9.x</text>
  </g>

  <!-- push -->
  <g transform="translate(55 590)">
    <text x="0" y="0" font-family="sans-serif" font-size="21" font-weight="700" fill="#0f172a">画面ID: push　通知設定</text>
    <g filter="url(#shadow)">
      <rect x="45" y="28" width="300" height="405" rx="36" fill="#111827"/>
      <rect x="57" y="40" width="276" height="381" rx="27" fill="#fff"/>
      <rect x="145" y="49" width="100" height="18" rx="9" fill="#111827"/>
    </g>
    <rect x="132" y="126" width="126" height="31" rx="15" fill="#eef2ff"/>
    <text x="195" y="147" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#3156c8">セットアップ</text>
    <text x="195" y="202" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#111827">プッシュ通知を</text>
    <text x="195" y="229" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#111827">有効にしてください</text>
    <rect x="90" y="265" width="210" height="55" rx="12" fill="#4f6fe8"/>
    <text x="195" y="300" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#fff">通知を許可する</text>
    <text x="310" y="397" text-anchor="end" font-family="sans-serif" font-size="10" fill="#94a3b8">app 2.9.x / ServiceWorker 2.9.x</text>
  </g>

  <!-- write -->
  <g transform="translate(485 590)">
    <text x="0" y="0" font-family="sans-serif" font-size="21" font-weight="700" fill="#0f172a">画面ID: write　編集</text>
    <g filter="url(#shadow)">
      <rect x="20" y="28" width="300" height="405" rx="36" fill="#111827"/>
      <rect x="32" y="40" width="276" height="381" rx="27" fill="#fff"/>
      <rect x="120" y="49" width="100" height="18" rx="9" fill="#111827"/>
    </g>
    <text x="52" y="101" font-family="sans-serif" font-size="14" fill="#3156c8">← 戻る</text>
    <text x="289" y="101" text-anchor="end" font-family="sans-serif" font-size="14" fill="#3156c8">PCへ送る</text>
    <rect x="52" y="122" width="236" height="48" rx="10" fill="#f8fafc" stroke="#d7dce3"/>
    <text x="67" y="152" font-family="sans-serif" font-size="16" fill="#334155">大事なメモ</text>
    <rect x="52" y="184" width="236" height="113" rx="10" fill="#f8fafc" stroke="#d7dce3"/>
    <text x="67" y="214" font-family="sans-serif" font-size="15" fill="#475569">明日の予定を確認する</text>
    <rect x="52" y="312" width="169" height="43" rx="10" fill="#eef2ff"/>
    <text x="136" y="339" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#3156c8">iPhoneに置く</text>
    <rect x="231" y="312" width="57" height="43" rx="10" fill="#eef2ff"/>
    <text x="259" y="339" text-anchor="middle" font-family="sans-serif" font-size="18">📷</text>
    <rect x="52" y="365" width="236" height="35" rx="8" fill="#e5e7eb"/>
    <text x="83" y="388" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700">B</text>
    <text x="136" y="388" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700">H1</text>
    <text x="190" y="388" text-anchor="middle" font-family="sans-serif" font-size="18">≡</text>
    <text x="285" y="414" text-anchor="end" font-family="sans-serif" font-size="10" fill="#94a3b8">app 2.9.x / ServiceWorker 2.9.x</text>
  </g>
</svg>
