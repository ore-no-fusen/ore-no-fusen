<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="690" viewBox="0 0 1140 690" role="img" aria-label="右クリック → ランチャー → トレイ：入口ごとの配置案"><rect width="1140" height="690" fill="#f2f6fa"/><g font-family="Yu Gothic,Meiryo,sans-serif"><text x="24" y="38" fill="#243c52" font-size="25">右クリック → ランチャー → トレイ：入口ごとの配置案</text><text x="24" y="70" fill="#243c52" font-size="17">構造を確認する仕様図です。現状維持・追加案・削除候補を区別しています。</text><rect x="20" y="95" width="350" height="540" rx="10" fill="#fff" stroke="#b6c4d0"/><rect x="20" y="95" width="350" height="55" rx="10" fill="#dcebf6" stroke="#b6c4d0"/><text x="36" y="130" fill="#243c52" font-size="21">S01 付箋の右クリック</text><text x="36" y="190" fill="#243c52" font-size="17">R01 新規・複製・フォルダー</text><text x="36" y="233" fill="#243c52" font-size="17">R02 色・透明度・文字サイズ</text><text x="36" y="276" fill="#243c52" font-size="17">R03 ランチャーに登録／解除</text><text x="36" y="319" fill="#243c52" font-size="17">R04 この付箋へのタグ付け外し</text><text x="36" y="362" fill="#243c52" font-size="17">R05 アラーム・iPhone・結晶化</text><text x="36" y="405" fill="#243c52" font-size="17">　　フォルダーへしまう・削除</text><text x="36" y="448" fill="#243c52" font-size="17">R06 アプリ操作・使い方・会話</text><text x="36" y="560" fill="#243c52" font-size="17">現在の付箋1枚が主な対象。</text><text x="36" y="590" fill="#243c52" font-size="17">既存の配置を基本に維持。</text><rect x="395" y="95" width="350" height="540" rx="10" fill="#fff" stroke="#b6c4d0"/><rect x="395" y="95" width="350" height="55" rx="10" fill="#dcebf6" stroke="#b6c4d0"/><text x="411" y="130" fill="#243c52" font-size="21">S04 ランチャーの「操作」</text><text x="411" y="190" fill="#243c52" font-size="17">A01 新規メモ</text><text x="411" y="233" fill="#243c52" font-size="17">A02 全文検索</text><text x="411" y="276" fill="#243c52" font-size="17">A03 フォルダーから取り出す</text><text x="411" y="319" fill="#243c52" font-size="17">A04 タグで整列／整列を戻す</text><text x="411" y="362" fill="#243c52" font-size="17">A05 一時全非表示／全部戻す</text><text x="411" y="405" fill="#243c52" font-size="17">A07 設定</text><text x="411" y="448" fill="#a14427" font-size="17">A06 画面のタグ絞込は移さない</text><text x="411" y="560" fill="#243c52" font-size="17">上部の小さい「操作」から。</text><text x="411" y="590" fill="#243c52" font-size="17">全体操作の移行候補（未実装）。</text><rect x="770" y="95" width="350" height="540" rx="10" fill="#fff" stroke="#b6c4d0"/><rect x="770" y="95" width="350" height="55" rx="10" fill="#dcebf6" stroke="#b6c4d0"/><text x="786" y="130" fill="#243c52" font-size="21">S05 トレイ</text><text x="786" y="190" fill="#243c52" font-size="17">T01 ランチャーを表示</text><text x="786" y="233" fill="#243c52" font-size="17">T02 既存の入口を移行中は維持</text><text x="786" y="276" fill="#243c52" font-size="17">　　新規・検索・取り出し</text><text x="786" y="319" fill="#243c52" font-size="17">　　整列・一時全非表示／戻す</text><text x="786" y="362" fill="#a14427" font-size="17">　　タグで絞込 → 削除候補</text><text x="786" y="405" fill="#243c52" font-size="17">T03 設定・終了</text><text x="786" y="560" fill="#243c52" font-size="17">補助の入口として残す。</text><text x="786" y="590" fill="#243c52" font-size="17">削除候補は実装削除前に検討。</text></g></svg>