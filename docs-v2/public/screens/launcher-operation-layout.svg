<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="820" viewBox="0 0 1060 820" role="img" aria-labelledby="title desc"><title id="title">既存ランチャーを基本にした操作の割り当て</title><desc id="desc">既存のタブ、タグ、登録一覧と格納した付箋、検索欄と行の格納ボタンを維持する。タグ列に作成用のプラスを加え、一括登録・一括格納・タグ名変更・削除は右クリックにまとめる。</desc><g font-family="Yu Gothic,Meiryo,sans-serif"><rect x="0" y="0" width="1060" height="820" rx="12" fill="#f3f6fa"/><text x="24" y="36" font-size="26" fill="#17324a">既存のランチャーを中心に使う：操作割り当て仕様図</text><text x="24" y="67" font-size="17" fill="#465e73">実機画面ではありません。現在の配置を基本に、必要な操作だけを追加します。</text><rect x="20" y="90" width="1020" height="525" rx="12" fill="#101112"/><rect x="20" y="90" width="1020" height="42" rx="6" fill="#1b1c1f"/><text x="38" y="118" font-size="19" fill="#d7e1e9">Quick Launcher</text><text x="976" y="118" font-size="19" fill="#d7e1e9">⑧ ×</text><rect x="32" y="145" width="240" height="44" rx="6" fill="#0ba5d5"/><text x="95" y="174" font-size="20" fill="#fff">ランチャー</text><rect x="282" y="145" width="240" height="44" rx="6" fill="#242629"/><text x="345" y="174" font-size="20" fill="#d7e1e9">QA</text><rect x="532" y="145" width="240" height="44" rx="6" fill="#242629"/><text x="595" y="174" font-size="20" fill="#d7e1e9">用語集</text><rect x="782" y="145" width="240" height="44" rx="6" fill="#242629"/><text x="845" y="174" font-size="20" fill="#d7e1e9">手順</text><text x="36" y="222" font-size="20" fill="#d7e1e9">②</text><rect x="72" y="198" width="118" height="36" rx="18" fill="#2c2e32"/><text x="92" y="222" font-size="17" fill="#d7e1e9">すべて</text><rect x="202" y="198" width="118" height="36" rx="18" fill="#0ba5d5"/><text x="222" y="222" font-size="17" fill="#d7e1e9">仕事</text><rect x="332" y="198" width="118" height="36" rx="18" fill="#2c2e32"/><text x="352" y="222" font-size="17" fill="#d7e1e9">趣味</text><rect x="462" y="198" width="118" height="36" rx="18" fill="#2c2e32"/><text x="482" y="222" font-size="17" fill="#d7e1e9">test</text><rect x="600" y="198" width="70" height="36" rx="18" fill="#2c2e32"/><text x="615" y="222" font-size="18" fill="#d7e1e9">⑨ ＋</text><text x="34" y="269" font-size="18" fill="#28c8fb">登録一覧</text><text x="135" y="269" font-size="18" fill="#d7e1e9">格納した付箋 (1)</text><text x="470" y="269" font-size="17" fill="#d7e1e9">同期 → PC ／ スマホ</text><rect x="32" y="287" width="996" height="44" rx="6" fill="#1b1d20"/><text x="48" y="315" font-size="18" fill="#8b98a5">検索</text><rect x="32" y="345" width="996" height="58" rx="6" fill="#163e4d"/><text x="49" y="381" font-size="19" fill="#d7e1e9">📌 付箋A（画面に出ている）</text><rect x="740" y="354" width="130" height="40" rx="6" fill="#1c3443"/><text x="753" y="381" font-size="17" fill="#d7e1e9">⑤ 格納</text><text x="885" y="381" font-size="17" fill="#d7e1e9">⑦ ↑↓</text><text x="982" y="381" font-size="17" fill="#d7e1e9">⑥ ×</text><rect x="32" y="410" width="996" height="58" rx="6" fill="#1c1e22"/><text x="49" y="446" font-size="19" fill="#d7e1e9">📌 付箋B（しまっている）</text><rect x="740" y="419" width="130" height="40" rx="6" fill="#1c3443"/><text x="753" y="446" font-size="17" fill="#d7e1e9">⑤ 取り出す</text><text x="885" y="446" font-size="17" fill="#d7e1e9">⑦ ↑↓</text><text x="982" y="446" font-size="17" fill="#d7e1e9">⑥ ×</text><text x="36" y="512" font-size="17" fill="#d7e1e9">① 個別登録：付箋を右クリック →「ランチャーに登録」</text><text x="36" y="546" font-size="17" fill="#d7e1e9">③④ タグ単位の一括操作：タグを右クリック →「登録」「格納」</text><text x="36" y="580" font-size="17" fill="#d7e1e9">⑩⑪ タグ自体の管理：タグを右クリック →「名前変更」「削除」</text><text x="24" y="655" font-size="20" fill="#17324a">⑤ 格納 ⇄ 取り出す：今の位置の同じボタン。登録と並び順は残る。</text><text x="24" y="693" font-size="20" fill="#17324a">⑨ ＋：タグ自体を作成。付箋が使っていなくても残せる。</text><text x="24" y="731" font-size="20" fill="#17324a">⑩ 名前変更：同じタグを使う付箋にも反映。</text><text x="24" y="769" font-size="20" fill="#17324a">⑪ 削除：確認後、全付箋からタグだけを外す。付箋や登録は削除しない。</text><rect x="828" y="96" width="100" height="30" rx="5" fill="#3a4652"/><text x="840" y="117" font-size="16" fill="#fff">操作 ▾</text><g><rect x="680" y="198" width="345" height="164" rx="6" fill="#26282c" stroke="#687786"/><text x="696" y="232" font-size="18" fill="#fff">③ このタグをまとめて登録</text><text x="696" y="270" font-size="18" fill="#fff">④ このタグをまとめて格納</text><text x="696" y="308" font-size="18" fill="#d7e1e9">⑩ タグ名を変更</text><text x="696" y="346" font-size="18" fill="#f3b4b4">⑪ タグを削除</text></g></g></svg>