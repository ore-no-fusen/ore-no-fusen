<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="760" viewBox="0 0 1080 760" role="img" aria-label="画面から消す4段階と戻し方"><rect width="1080" height="760" fill="#f3f6fa"/><g font-family="Yu Gothic,Meiryo,sans-serif"><text x="24" y="40" font-size="27" fill="#223c52">画面から消す：次に使う頻度と、戻しやすさで分ける</text><text x="24" y="77" font-size="19" fill="#223c52">分類の仕様案です。数字の順番に操作する必要はありません。</text><rect x="20" y="108" width="520" height="250" rx="12" fill="#fff" stroke="#b4c4d1"/><rect x="20" y="108" width="520" height="60" rx="12" fill="#dceefa"/><text x="38" y="147" font-size="25" fill="#223c52">1 一時的に隠す</text><text x="38" y="208" font-size="21" fill="#223c52">すぐ戻す：会議や別の作業の間だけ</text><text x="38" y="248" font-size="21" fill="#223c52">保存場所もランチャー登録も変えない</text><text x="38" y="288" font-size="21" fill="#223c52">戻し方：既存の「全部戻す」</text><text x="38" y="328" font-size="21" fill="#223c52">格納していた付箋は取り出さない</text><rect x="555" y="108" width="520" height="250" rx="12" fill="#fff" stroke="#b4c4d1"/><rect x="555" y="108" width="520" height="60" rx="12" fill="#dff2e7"/><text x="573" y="147" font-size="25" fill="#223c52">2 ランチャーにしまう</text><text x="573" y="208" font-size="21" fill="#223c52">繰り返し使う：日常の画面をすっきり</text><text x="573" y="248" font-size="21" fill="#223c52">一覧に登録を残し、画面から隠す</text><text x="573" y="288" font-size="21" fill="#223c52">戻し方：行の「取り出す」1回</text><text x="573" y="328" font-size="21" fill="#223c52">同じ位置の「格納」でまた隠す</text><rect x="20" y="383" width="520" height="250" rx="12" fill="#fff" stroke="#b4c4d1"/><rect x="20" y="383" width="520" height="60" rx="12" fill="#fff0d8"/><text x="38" y="422" font-size="25" fill="#223c52">3 フォルダーに保管する</text><text x="38" y="483" font-size="21" fill="#223c52">しばらく使わないが、残しておく</text><text x="38" y="523" font-size="21" fill="#223c52">保管先へ本文と画像参照を移す</text><text x="38" y="563" font-size="21" fill="#223c52">戻し方：保管済みの付箋から探す</text><text x="38" y="603" font-size="21" fill="#223c52">必要な付箋を選び、元へ戻す</text><rect x="555" y="383" width="520" height="250" rx="12" fill="#fff" stroke="#b4c4d1"/><rect x="555" y="383" width="520" height="60" rx="12" fill="#fbe5e5"/><text x="573" y="422" font-size="25" fill="#223c52">4 ゴミ箱へ移す</text><text x="573" y="483" font-size="21" fill="#223c52">不要になった：削除の意思がある</text><text x="573" y="523" font-size="21" fill="#223c52">通常一覧から外し、Trashへ移す</text><text x="573" y="563" font-size="21" fill="#223c52">戻し方：完全削除前に手動で復旧</text><text x="573" y="603" font-size="21" fill="#223c52">現状、アプリ内の専用復元ボタンなし</text><text x="24" y="702" font-size="21" fill="#223c52">完全削除は別扱い：アプリの通常操作では元へ戻せません。</text><text x="24" y="739" font-size="21" fill="#223c52">「画面から隠す」と「ランチャー登録を解除する」は別の操作です。</text></g></svg>