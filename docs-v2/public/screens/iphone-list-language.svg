<svg xmlns="http://www.w3.org/2000/svg" width="920" height="650" viewBox="0 0 920 650" role="img" aria-labelledby="title desc">
  <title id="title">画面ID list メモ一覧画面と言語切替ボタン</title>
  <desc id="desc">iPhone PWAのメモ一覧画面。画面上部のメモ見出しの右側に言語切替ボタンがある。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity=".18"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="920" height="650" rx="24" fill="#f8fafc"/>
  <text x="52" y="55" font-family="sans-serif" font-size="25" font-weight="700" fill="#0f172a">画面ID: list　メモ一覧</text>
  <text x="52" y="86" font-family="sans-serif" font-size="16" fill="#475569">iPhone PWA／日本語表示時</text>

  <g filter="url(#shadow)">
    <rect x="70" y="112" width="380" height="490" rx="42" fill="#111827"/>
    <rect x="84" y="126" width="352" height="462" rx="32" fill="#f2f2f7"/>
    <rect x="200" y="135" width="120" height="22" rx="11" fill="#111827"/>
  </g>

  <rect x="84" y="169" width="352" height="69" fill="#ffffff"/>
  <text x="110" y="213" font-family="sans-serif" font-size="27" font-weight="700" fill="#111827">メモ</text>
  <rect x="252" y="182" width="104" height="42" rx="12" fill="#eef2ff" stroke="#4f6fe8" stroke-width="2"/>
  <text x="304" y="209" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#3156c8">◎ EN</text>
  <text x="390" y="213" text-anchor="middle" font-family="sans-serif" font-size="32" fill="#111827">＋</text>

  <g font-family="sans-serif">
    <rect x="101" y="258" width="318" height="78" rx="14" fill="#fff" stroke="#dbe1e8"/>
    <circle cx="126" cy="286" r="9" fill="#4f6fe8"/>
    <text x="148" y="292" font-size="18" font-weight="600" fill="#1f2937">大事なメモ</text>
    <text x="392" y="292" text-anchor="end" font-size="19">🔔</text>
    <text x="126" y="317" font-size="14" fill="#64748b">明日の予定を確認する</text>

    <rect x="101" y="350" width="318" height="78" rx="14" fill="#fff" stroke="#dbe1e8"/>
    <circle cx="126" cy="378" r="9" fill="#f5d76e"/>
    <text x="148" y="384" font-size="18" font-weight="600" fill="#1f2937">買い物リスト</text>
    <text x="392" y="384" text-anchor="end" font-size="19">🔕</text>
    <text x="126" y="409" font-size="14" fill="#64748b">牛乳、パン、コーヒー</text>

    <rect x="101" y="442" width="318" height="78" rx="14" fill="#fff" stroke="#dbe1e8"/>
    <circle cx="126" cy="470" r="9" fill="#f5d76e"/>
    <text x="148" y="476" font-size="18" font-weight="600" fill="#1f2937">アイデアメモ</text>
    <text x="392" y="476" text-anchor="end" font-size="19">🔕</text>
    <text x="126" y="501" font-size="14" fill="#64748b">次回やりたいこと</text>

    <text x="410" y="565" text-anchor="end" font-size="12" fill="#94a3b8">app 2.9.x / ServiceWorker 2.9.x</text>
  </g>

  <path d="M605 215 C545 215 465 204 365 203" fill="none" stroke="#dc2626" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="590" y="136" width="280" height="154" rx="18" fill="#fff" stroke="#dc2626" stroke-width="3"/>
  <text x="620" y="178" font-family="sans-serif" font-size="22" font-weight="700" fill="#991b1b">言語切替ボタン</text>
  <text x="620" y="216" font-family="sans-serif" font-size="17" fill="#334155">日本語表示中：◎ EN</text>
  <text x="620" y="247" font-family="sans-serif" font-size="17" fill="#334155">英語表示中　：◎ 日本</text>
  <text x="590" y="342" font-family="sans-serif" font-size="18" font-weight="700" fill="#0f172a">操作結果</text>
  <text x="590" y="376" font-family="sans-serif" font-size="16" fill="#475569">タップすると同じ画面のまま</text>
  <text x="590" y="404" font-family="sans-serif" font-size="16" fill="#475569">日本語／英語を切り替えます。</text>
  <text x="590" y="448" font-family="sans-serif" font-size="16" fill="#475569">設定はこのiPhone内に保存され、</text>
  <text x="590" y="476" font-family="sans-serif" font-size="16" fill="#475569">PC側の言語設定とは連動しません。</text>
</svg>
