<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="630" viewBox="0 0 1060 630" role="img" aria-label="QLタグの使用枚数順と未使用タグの整理"><rect width="1060" height="630" rx="12" fill="#f3f7fb"/><g font-family="Yu Gothic,Meiryo,sans-serif"><text x="24" y="36" font-size="25" fill="#17324a">タグ：よく使うものを左へ、不要なものはQLで整理</text><rect x="20" y="60" width="1020" height="146" rx="9" fill="#101216"/><text x="36" y="91" font-size="19" fill="#ecf3f8">Quick Launcher</text><rect x="36" y="108" width="100" height="42" rx="9" fill="#00a7d9"/><text x="48" y="136" font-size="18" fill="#ecf3f8">すべて</text><rect x="146" y="108" width="140" height="42" rx="9" fill="#30343a"/><text x="158" y="136" font-size="18" fill="#ecf3f8">仕事</text><rect x="296" y="108" width="140" height="42" rx="9" fill="#30343a"/><text x="308" y="136" font-size="18" fill="#ecf3f8">生活</text><rect x="446" y="108" width="190" height="42" rx="9" fill="#30343a"/><text x="458" y="136" font-size="18" fill="#ecf3f8">新しいタグ</text><rect x="646" y="108" width="180" height="42" rx="9" fill="#30343a"/><text x="658" y="136" font-size="18" fill="#ecf3f8">古いタグ</text><rect x="836" y="108" width="60" height="42" rx="9" fill="#00a7d9"/><text x="848" y="136" font-size="18" fill="#ecf3f8">＋</text><text x="36" y="185" font-size="20" fill="#ecf3f8">左端固定　→　使用枚数が多い順　→　0件は新しい順</text><text x="24" y="246" font-size="22" fill="#17324a">① ＋ → タグの名前変更・削除・未使用整理</text><text x="24" y="281" font-size="22" fill="#17324a">②「未使用タグを整理」→ 選ぶ</text><rect x="24" y="303" width="480" height="270" rx="9" fill="#17191f"/><text x="44" y="338" font-size="23" fill="#ecf3f8">タグ管理</text><rect x="44" y="356" width="200" height="36" rx="9" fill="#067ca6"/><text x="54" y="381" font-size="17" fill="#ecf3f8">未使用タグを整理 (2)</text><text x="44" y="428" font-size="21" fill="#ecf3f8">☑ 新しいタグ　(0件)</text><text x="44" y="469" font-size="21" fill="#ecf3f8">☐ 古いタグ　　(0件)</text><rect x="44" y="505" width="430" height="46" rx="9" fill="#6c2936"/><text x="58" y="535" font-size="21" fill="#ecf3f8">選んだ未使用タグを削除</text><text x="554" y="281" font-size="22" fill="#17324a">③ 確認して削除</text><rect x="550" y="303" width="486" height="270" rx="9" fill="#17191f"/><text x="570" y="341" font-size="23" fill="#ecf3f8">未使用タグの削除確認</text><text x="570" y="390" font-size="21" fill="#ecf3f8">選んだ1件：新しいタグ</text><text x="570" y="431" font-size="21" fill="#ecf3f8">付箋は変更しません。</text><rect x="570" y="505" width="442" height="46" rx="9" fill="#6c2936"/><text x="590" y="535" font-size="21" fill="#ecf3f8">1件の未使用タグを削除</text><text x="24" y="610" font-size="18" fill="#17324a">保管した付箋で使うタグは残ります。最後の付箋を削除してもタグは自動削除しません。</text></g></svg>