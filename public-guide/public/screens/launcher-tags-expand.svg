<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
<title id="title">タグが多いときは「すべてのタグ」で展開</title><desc id="desc">普段は1行。すべてのタグを押すと複数行。選ぶと1行に戻り、選択中のタグが見える。</desc>
<rect width="760" height="360" rx="16" fill="#f4f7fb"/>
<g font-family="sans-serif" font-size="16" fill="#172032">
<text x="24" y="32" font-weight="bold">① 全部見る →「すべてのタグ ▾」を押す</text>
<rect x="24" y="47" width="712" height="72" rx="10" fill="#18181b"/>
<rect x="40" y="68" width="70" height="30" rx="15" fill="#3f3f46"/><text x="50" y="89" fill="white">すべて</text>
<rect x="119" y="68" width="86" height="30" rx="15" fill="#0ea5e9"/><text x="146" y="89" fill="white">仕事</text>
<rect x="214" y="68" width="86" height="30" rx="15" fill="#3f3f46"/><text x="240" y="89" fill="white">生活</text>
<rect x="309" y="68" width="86" height="30" rx="15" fill="#3f3f46"/><text x="336" y="89" fill="white">旅行</text>
<rect x="529" y="65" width="190" height="36" rx="6" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/><text x="546" y="89" fill="white">すべてのタグ ▾</text>
<path d="M380 125v28m-8-8 8 8 8-8" stroke="#475569" fill="none" stroke-width="3"/>
<text x="24" y="179" font-weight="bold">② タグを選ぶ → 自動で1行に戻る</text>
<rect x="24" y="194" width="712" height="142" rx="10" fill="#18181b"/>
<rect x="40" y="209" width="70" height="30" rx="15" fill="#3f3f46"/><text x="50" y="230" fill="white">すべて</text>
<g fill="#3f3f46"><rect x="120" y="209" width="86" height="30" rx="15"/><rect x="215" y="209" width="86" height="30" rx="15"/><rect x="310" y="209" width="86" height="30" rx="15"/><rect x="120" y="250" width="118" height="30" rx="15"/><rect x="247" y="250" width="104" height="30" rx="15"/></g>
<rect x="360" y="250" width="112" height="30" rx="15" fill="#0ea5e9" stroke="white" stroke-width="2"/>
<g fill="white"><text x="146" y="230">仕事</text><text x="240" y="230">生活</text><text x="336" y="230">旅行</text><text x="134" y="271">プロンプト</text><text x="269" y="271">三味線</text><text x="383" y="271">趣味</text><text x="555" y="231">折りたたむ ▴</text></g>
<text x="120" y="313" fill="#cbd5e1">選んだタグは、1行に戻っても見える位置へ。</text>
</g></svg>
