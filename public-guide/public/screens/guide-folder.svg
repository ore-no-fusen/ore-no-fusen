<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="880" viewBox="0 0 1060 880" role="img" aria-label="フォルダーに保管するの操作入口から戻し方まで"><rect width="1060" height="880" fill="#f2f6fa"/><g font-family="Yu Gothic,Meiryo,sans-serif"><text x="20" y="38" font-size="28" fill="#18364b">フォルダーに保管する</text><rect x="14" y="58" width="510" height="808" rx="8" fill="#fff" stroke="#9aabba"/><rect x="536" y="58" width="510" height="808" rx="8" fill="#fff" stroke="#9aabba"/><text x="33" y="94" font-size="24" fill="#18364b">画面から消す</text><text x="555" y="94" font-size="24" fill="#18364b">戻す</text><text x="34" y="137" font-size="22" fill="#18364b">① 付箋を右クリック</text><rect x="40" y="157" width="95" height="76" rx="8" fill="#fff0ad" stroke="#9aabba"/><text x="52" y="186" font-size="19" fill="#18364b">メモA</text><rect x="155" y="157" width="340" height="140" rx="8" fill="#f7fafc" stroke="#9aabba"/><text x="170" y="191" font-size="19" fill="#18364b">タグ</text><rect x="160" y="205" width="330" height="39" rx="8" fill="#d5edff" stroke="#9aabba"/><text x="170" y="233" font-size="19" fill="#18364b">タグフォルダへしまう</text><text x="170" y="275" font-size="19" fill="#18364b">削除</text><circle cx="452" cy="227" r="19" fill="none" stroke="#df473b" stroke-width="4"/><path d="M460 235l18 24 3-13 13-2z" fill="#df473b" stroke="#fff"/><path d="M266 308v35m-10-11 10 11 10-11" fill="none" stroke="#2279aa" stroke-width="4"/><text x="34" y="385" font-size="22" fill="#18364b">② 複数タグなら保管先を選ぶ</text><rect x="105" y="410" width="340" height="98" rx="8" fill="#f7fafc" stroke="#9aabba"/><rect x="110" y="416" width="330" height="39" rx="8" fill="#d5edff" stroke="#9aabba"/><text x="120" y="444" font-size="19" fill="#18364b">仕事</text><text x="120" y="486" font-size="19" fill="#18364b">資料</text><circle cx="402" cy="438" r="19" fill="none" stroke="#df473b" stroke-width="4"/><path d="M410 446l18 24 3-13 13-2z" fill="#df473b" stroke="#fff"/><path d="M266 526v35m-10-11 10 11 10-11" fill="none" stroke="#2279aa" stroke-width="4"/><rect