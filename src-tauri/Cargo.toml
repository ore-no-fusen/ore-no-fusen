# Tauri アプリケーションマニフェスト (Rust)
#
# 責務:
# - Rustクレートの依存関係管理
# - ビルド設定 (features, capabilities)

[package]
name = "ore-no-fusen"
version = "4.0.4"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
# time は間接依存（tauri/cookie 等が利用）。0.3.48 は cookie/tauri-utils と
# trait の重複実装 (E0119) を起こしビルドが失敗するため 0.3.47 に固定する。
# Tauri 側が新しい time に対応したら、この固定を外して追従できる。
time = "=0.3.47"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.9.5", features = ["tray-icon", "image-ico", "image-png", "protocol-asset"] }
uuid = { version = "1.10.0", features = ["v4"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
walkdir = "2"
dunce = "1"
rfd = "0.14"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
raw-window-handle = "0.6"
env_logger = "0.11.8"
screenshots = "0.8.10"
image = "0.25.6"
directories = "6.0.0"
arboard = "3.6.1"
rodio = "0.19.0"
tauri-plugin-global-shortcut = "2"
tauri-plugin-os = "2.3.2"
tokio = { version = "1", features = ["rt", "time"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
base64 = "0.22"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "multipart", "http2"] }
oauth2 = { version = "5.0", features = ["reqwest"] }
url = "2"
tauri-plugin-oauth = "2"
p256 = { version = "0.13", features = ["ecdh", "ecdsa", "pkcs8"] }
jsonwebtoken = "9"
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
tauri-plugin-notification = "2"
sys-locale = "0.3"


[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_UI_Shell",      # ITaskbarList (AddTab/DeleteTab) - Alt+Tab直接制御
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",    # CoCreateInstance - COMオブジェクト生成
    "Win32_System_Diagnostics_Debug", # AddVectoredExceptionHandler - 注入DLL例外の記録
    "Win32_System_Kernel", # EXCEPTION_POINTERS など VEH 関連型に必要
    "ApplicationModel",
    "Foundation",
] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2"

[dev-dependencies]
tempfile = "3.8"
